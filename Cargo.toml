[workspace]
resolver = "3"
members = ["apps/pod-rattle-plugin", "libs/pod-rattle-engine", "tools/xtask"]
exclude = ["vendor/vst3-com"]

# vst3-com の vtable! は式の位置で末尾に `;` を残しており、rustc の
# semicolon_in_expressions_from_non_local_macros に掛かる。直した写しに差し替える。
[patch."https://github.com/robbert-vdh/vst3-sys.git"]
vst3-com = { path = "vendor/vst3-com" }

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/masseater/masseater.dev"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"
many_single_char_names = "allow"
needless_range_loop = "allow"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
