[workspace]
resolver = "3"
members = [
  "apps/aredoko-desktop/src-tauri",
  "apps/pod-rattle-plugin",
  "libs/pod-rattle-engine",
  "tools/xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/masseater/masseater.dev"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"
many_single_char_names = "allow"
needless_range_loop = "allow"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.bench]
strip = "none"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
