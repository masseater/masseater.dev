[workspace]
resolver = "3"
members = [
  "apps/aredoko-desktop/src-tauri",
  "apps/yakusu/src-tauri",
  "apps/yohaku-desktop/src-tauri",
  "apps/pod-rattle-plugin",
  "libs/pod-rattle-engine",
  "tools/mosaic",
  "tools/seikin-dance",
  "tools/pod-rattle-host",
  "tools/xtask",
  "libs/effect2rs/conformance",
  "libs/desktop-shell",
  "libs/media-notes",
  "apps/shirushi/src-tauri",
  "apps/fushi/src-tauri",
  "libs/roformer",
  "libs/audio-fetch",
  "apps/yogoto/src-tauri",
]
exclude = ["patches/crates/proc-macro-crate", "patches/crates/tauri-macros"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/masseater/masseater.dev"
rust-version = "1.100"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"
many_single_char_names = "allow"
needless_range_loop = "allow"

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
strip = "symbols"

[profile.bench]
strip = "none"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[profile.dev.package.roformer]
opt-level = 3

[profile.dev.package.candle-core]
opt-level = 3

[profile.dev.package.candle-nn]
opt-level = 3

[profile.dev.package.gemm-f32]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

[profile.dev.package.beat-this]
opt-level = 3

[profile.dev.package.rten]
opt-level = 3

[profile.dev.package.rten-base]
opt-level = 3

[profile.dev.package.rten-gemm]
opt-level = 3

[profile.dev.package.rten-simd]
opt-level = 3

[profile.dev.package.rten-tensor]
opt-level = 3

[profile.dev.package.rten-vecmath]
opt-level = 3

[patch.crates-io]
proc-macro-crate = { path = "patches/crates/proc-macro-crate" } # exit: crate:tauri requires tao@>=0.38
tauri-macros = { path = "patches/crates/tauri-macros" } # exit: crate:tauri-macros@>2.7.6
