[package]
name = "roformer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
candle-core = "=0.11.1"
candle-nn = "=0.11.1"
realfft = "=3.5.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde-saphyr = "=2.1.1"
hf-hub = { version = "=1.0.0", features = ["blocking", "rustls-tls"] }

[features]
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dev-dependencies]
ndarray = "=0.17.2"
ndarray-npy = "=0.11.0"

[lints]
workspace = true
