[package]
name = "wism-core"
version = "0.1.0"
edition.workspace = true
license = "MIT"
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
oxc_allocator = "0.159.0"
oxc_parser = "0.159.0"
oxc_resolver = "11.24.3"
oxc_span = "0.159.0"
proc-macro2 = { version = "1", features = ["span-locations"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
rayon = "1"
syn = { version = "3.0.10", features = ["full", "visit"] }
tracing = "0.1"

[lints]
workspace = true
