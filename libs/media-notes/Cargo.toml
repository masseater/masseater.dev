[package]
name = "media-notes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
local-mcp = { path = "../local-mcp" }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "query",
  "rustls",
  "system-proxy",
] }
rmcp = { version = "3.10", features = ["macros", "server", "transport-streamable-http-server"] }
rusqlite = { version = "0.42", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
specta = { version = "=2.0.0-rc.28", features = ["derive", "function"] }
specta-typescript = "0.0.15"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
url = "2"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
