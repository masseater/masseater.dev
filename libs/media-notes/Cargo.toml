[package]
name = "media-notes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
desktop-shell = { path = "../desktop-shell" }
regex = "=1.13.2"
reqwest = { version = "=0.13.5", default-features = false, features = [
  "json",
  "query",
  "rustls",
  "system-proxy",
] }
rmcp = { version = "=3.11.0", features = ["macros", "server", "transport-streamable-http-server"] }
rusqlite = { version = "=0.43.0", features = ["bundled"] }
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
specta = { version = "=2.0.0-rc.28", features = ["derive", "function"] }
specta-typescript = "=0.0.15"
tauri = { version = "=2.12.7", features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.8.4"
url = "=2.5.9"
uuid = { version = "=1.29.3", features = ["v7"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
