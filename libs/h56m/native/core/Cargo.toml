[package]
name = "h56m-core"
version = "0.1.0"
edition.workspace = true
license = "MIT"
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1"
gix = { version = "0.90", default-features = false, features = ["revision"] }
kingfisher-rules = "3.2.1"
kingfisher-scanner = { version = "4.0.0", features = ["git"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tempfile = "3.27.0"
toml = "1.2.1"
tracing = "0.1"

[lints]
workspace = true
