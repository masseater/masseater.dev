[package]
name = "h56m-core"
version = "0.1.0"
edition.workspace = true
license = "MIT"
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
aho-corasick = "=1.1.5"
anyhow = "=1.0.104"
base64 = "=0.23.1"
flate2 = "=1.1.11"
gix = { version = "=0.90.0", default-features = false, features = [
  "max-performance",
  "revision",
  "sha1",
] }
regex = "=1.13.1"
regex-syntax = "=0.8.11"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tiktoken-rs = "=0.12.1"
toml = "=1.2.1"
tracing = "=0.1.44"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
