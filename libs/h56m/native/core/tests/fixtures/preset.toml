title = "h56m test preset"

[[rules]]
id = "github-pat"
description = "Uncovered a GitHub Personal Access Token"
regex = '''ghp_[0-9a-zA-Z]{36}'''
keywords = ["ghp_"]

[[rules]]
id = "generic-username"
description = "A username next to other secrets"
regex = '''username:\s*"([^"]+)"'''
keywords = ["username"]
skipReport = true
