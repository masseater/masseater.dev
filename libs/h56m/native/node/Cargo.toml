[package]
name = "h56m-node"
version = "0.1.0"
edition.workspace = true
license = "MIT"
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
h56m-core = { path = "../core" }
napi = { version = "3.16.2", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = "3.7.1"
napi-telemetry = { path = "../../../napi-telemetry" }
serde = "1"
serde_json = "1.0.154"
tracing = "0.1.44"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"
many_single_char_names = "allow"
needless_range_loop = "allow"

[build-dependencies]
napi-build = "2.6.0"
