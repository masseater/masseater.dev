[package]
name = "audio-fetch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
aes = "=0.9.4"
cbc = { version = "=0.2.1", features = ["alloc"] }
futures = "=0.3.34"
regex = "=1.13.2"
reqwest = { version = "=0.13.5", default-features = false, features = [
  "cookies",
  "gzip",
  "http2",
  "json",
  "query",
  "rustls",
  "system-proxy",
] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["fs", "process", "rt"] }
tracing = "=0.1.44"
zip = { version = "=9.7.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
