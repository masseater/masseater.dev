[package]
name = "mdlint-core"
version = "0.1.0"
edition.workspace = true
license = "MIT"
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
pulldown-cmark = { version = "0.13.6", default-features = false }
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
unicode-width = "0.2.3"

[lints]
workspace = true
