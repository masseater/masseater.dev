[package]
name = "desktop-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = "=0.8.9"
constant_time_eq = "=0.6.1"
getrandom = "=0.4.3"
rmcp = { version = "=3.10.0", features = ["macros", "server", "transport-streamable-http-server"] }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-localhost = "=2.4.0"
tauri-plugin-prevent-default = "=6.0.1"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-window-state = "=2.5.0"
tokio = { version = "=1.54.1", features = ["net"] }
url = "=2.5.8"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
