[tools]
dotnet = "11.0.100"
"github:open-telemetry/weaver" = "0.28.0"

[tools."github:open-telemetry/opentelemetry-collector-releases"]
version = "0.165.0"

[tools."github:open-telemetry/opentelemetry-collector-releases".platforms]
linux-x64 = { asset_pattern = "otelcol_*_linux_amd64.tar.gz" }
linux-arm64 = { asset_pattern = "otelcol_*_linux_arm64.tar.gz" }
macos-arm64 = { asset_pattern = "otelcol_*_darwin_arm64.tar.gz" }

[settings]
lockfile = true
