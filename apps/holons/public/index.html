<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1 人のためのホロン</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root { --bg: #ffffff; --ink: #1f2933; --sub: #6b7785; --line: #d5dae0; --font: "Noto Sans JP", "Noto Sans CJK JP", "Hiragino Sans", sans-serif; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
.stage { position: relative; height: 100vh; height: 100dvh; overflow: hidden;
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); box-sizing: border-box; }
.stage svg { display: block; width: 100%; height: 100%; font-family: var(--font); touch-action: none; cursor: grab; user-select: none; transform-origin: 0 0; will-change: transform; text-rendering: optimizeSpeed; }
.stage svg.dragging { cursor: grabbing; }
.bar { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 6px; }
.bar button { font: 700 15px/1 var(--font); color: var(--ink); background: #ffffff; border: 1.5px solid var(--line);
  border-radius: 8px; min-width: 40px; height: 40px; padding: 0 12px; cursor: pointer; }
.bar button:hover { border-color: var(--ink); }
.bar span { font: 500 13px/1.4 var(--font); color: var(--sub); margin-left: 6px; }
</style>
</head>

<svg id="map" viewBox="0 0 2100 1210" preserveAspectRatio="xMidYMid meet" role="img" aria-label="各ホロンは改善提案を DB に置くだけで、ホロン F が見に行き、鵜呑みにせず入れて測る。人間は窓口と話し、見に行って手を入れるのはホロン F だけで、直すのは F の測り方と決まり。F が各ホロンのやり方を変えるときは確認なしで入れ、測って増えたら戻す。ホロン F はすべてのホロンを見て、人の直しや求めた分を集め、繰り返しを見つけてやり方を変え、人に求める分が減ったかを大原則に照らして測る。大原則は、AI は複数でも統べる人は 1 人で注意力と認知力に限りがあるので、何をするにも人に求める分を極限まで小さくすること。1 人の人間と、それぞれ同じ形で回るホロンを描いた壁打ち中の図。人間が話すのはホロンの外にいる窓口だけで、窓口は今この人に伝えるかを決め、やるねと聞く。沈黙で進むかは選べる。ホロン D は人生を支え、お金や予定や体調や連絡を見て崩れを片付け、済んだら窓口に知らせる。ホロン E は人生を進め、目標や記録や世の中を見て案を作って窓口に渡し、反応から好みを覚え、頷けば望みごとにホロン C を立てる。ホロン C は望みを依頼に分けてキューに積み、報告を望みと照らす。ホロン G は動いているものを定期に点検し、壊れを見つけてキューに積み、直ったか確かめる。プロジェクトのホロン B が依頼を受け取る。ホロン B はタスクごとにホロン A を立て、A は 1 つの変更を作って確かめて公開する。">

<div class="bar"><button id="zin" aria-label="拡大">＋</button><button id="zout" aria-label="縮小">－</button><button id="zall">全体</button><span>拡大するとホロンの中身が見える</span></div>
</div>
<script>
(() => {
  const svg = document.getElementById('map'), stage = svg.parentElement, W = 2100, H = 1210, MINW = 14;
  // every zoom-dependent group, read once
  const groups = [...svg.querySelectorAll('.detail, .ov')].map(el => ({
    el, det: el.classList.contains('detail'), r: +el.dataset.r, cx: +el.dataset.cx, cy: +el.dataset.cy, o: -1 }));
  let vb = {x: 0, y: 0, w: W, h: H};   // what the user is looking at
  let shown = {...vb};                 // what the SVG was last rendered with
  let cw = 1, ch = 1;
  const fit = v => { const k = Math.min(cw / v.w, ch / v.h); return {k, ox: (cw - v.w * k) / 2, oy: (ch - v.h * k) / 2}; };
  function measure() { const r = stage.getBoundingClientRect(); cw = r.width; ch = r.height; }
  function toSvg(clientX, clientY) {
    const r = stage.getBoundingClientRect(), f = fit(vb);
    return {x: vb.x + (clientX - r.left - f.ox) / f.k, y: vb.y + (clientY - r.top - f.oy) / f.k};
  }
  // cheap frame: move the already-drawn picture with a GPU transform
  function preview() {
    const a = fit(shown), b = fit(vb), s = b.k / a.k;
    const tx = b.ox - vb.x * b.k - s * (a.ox - shown.x * a.k), ty = b.oy - vb.y * b.k - s * (a.oy - shown.y * a.k);
    svg.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
  }
  // sharp frame: redraw with the new viewBox and switch details, only once the motion settles
  function commit() {
    shown = {...vb};
    svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    svg.style.transform = '';
    const span = Math.min(vb.w, vb.h * cw / ch);
    const x0 = vb.x - vb.w * 0.5, x1 = vb.x + vb.w * 1.5, y0 = vb.y - vb.h * 0.5, y1 = vb.y + vb.h * 1.5;
    for (const g of groups) {
      const frac = 2 * g.r / span;
      let o = g.det ? Math.max(0, Math.min(1, (frac - 0.42) / 0.14)) : 1 - Math.max(0, Math.min(1, (frac - 0.34) / 0.1));
      if (g.det && o > 0 && (g.cx + g.r < x0 || g.cx - g.r > x1 || g.cy + g.r < y0 || g.cy - g.r > y1)) o = 0;
      o = Math.round(o * 20) / 20;
      if (o === g.o) continue;
      g.o = o;
      if (o === 0) { g.el.style.display = 'none'; continue; }
      g.el.style.display = '';
      g.el.setAttribute('opacity', o);
    }
  }
  let raf = 0, idle = 0;
  function schedule() {
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; preview(); });
    clearTimeout(idle); idle = setTimeout(commit, 140);
  }
  function clamp() {
    vb.w = Math.max(MINW, Math.min(W, vb.w)); vb.h = vb.w * H / W;
    vb.x = Math.max(-vb.w / 2, Math.min(W - vb.w / 2, vb.x));
    vb.y = Math.max(-vb.h / 2, Math.min(H - vb.h / 2, vb.y));
  }
  function zoomAt(p, f) {
    const nw = Math.max(MINW, Math.min(W, vb.w / f)); f = vb.w / nw;
    vb = {x: p.x - (p.x - vb.x) / f, y: p.y - (p.y - vb.y) / f, w: nw, h: nw * H / W};
    clamp(); schedule();
  }
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    zoomAt(toSvg(e.clientX, e.clientY), Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018)));
  }, {passive: false});
  const pts = new Map(); let last = null, pinch = 0;
  svg.addEventListener('pointerdown', e => {
    svg.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (pts.size === 1) { last = {x: e.clientX, y: e.clientY}; svg.classList.add('dragging'); }
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); }
  });
  svg.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (pts.size === 2) {
      const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinch) zoomAt(toSvg((a.x + b.x) / 2, (a.y + b.y) / 2), d / pinch); pinch = d; return;
    }
    if (last) {
      const k = fit(vb).k;
      vb.x -= (e.clientX - last.x) / k; vb.y -= (e.clientY - last.y) / k;
      clamp(); schedule(); last = {x: e.clientX, y: e.clientY};
    }
  });
  const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = 0; if (!pts.size) { last = null; svg.classList.remove('dragging'); } };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  svg.addEventListener('dblclick', e => zoomAt(toSvg(e.clientX, e.clientY), 2.5));
  const center = () => ({x: vb.x + vb.w / 2, y: vb.y + vb.h / 2});
  document.getElementById('zin').onclick = () => zoomAt(center(), 1.8);
  document.getElementById('zout').onclick = () => zoomAt(center(), 1 / 1.8);
  document.getElementById('zall').onclick = () => { vb = {x: 0, y: 0, w: W, h: H}; schedule(); };
  addEventListener('resize', () => { measure(); commit(); });
  measure(); commit();
})();
</script>
