[package]
name = "aredoko-desktop"
version = "0.0.0"
license = "AGPL-3.0-only"
edition = "2024"
publish = false

[lib]
name = "aredoko_desktop"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
dunce = "=1.0.5"
tauri = { version = "=2.12.5", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.3"
tauri-plugin-single-instance = "=2.5.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

