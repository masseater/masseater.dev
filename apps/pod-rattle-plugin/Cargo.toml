[package]
name = "pod_rattle"
version = "0.0.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "pod-rattle"
path = "src/main.rs"
required-features = ["standalone"]

[features]
standalone = ["nice-plug/standalone"]

[dependencies]
pod-rattle-engine = { path = "../../libs/pod-rattle-engine" }
nice-plug = { version = "0.4.2", features = ["assert_process_allocs"] }
nice-plug-egui = "0.6.0"
egui = { version = "0.37.0", features = ["default_fonts"] }
triple_buffer = "9"
atomic_float = "1"

[lints]
workspace = true
