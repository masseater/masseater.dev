[package]
name = "yohaku-desktop"
version = "0.1.8"
license = "AGPL-3.0-only"
edition = "2024"
publish = false

[lib]
name = "yohaku_desktop"

[build-dependencies]
tauri-build = { version = "=2.7.5", features = [] }

[dependencies]
axum = "=0.8.9"
desktop-shell = { path = "../../../libs/desktop-shell" }
dunce = "=1.0.5"
keyring = "=4.2.0"
log = "=0.4.35"
oauth2 = { version = "=5.0.0", default-features = false }
regex = "=1.13.1"
reqwest = { version = "=0.13.5", default-features = false, features = [
  "form",
  "query",
  "json",
  "rustls",
  "system-proxy",
] }
rmcp = { version = "=3.10.0", features = ["macros", "server", "transport-streamable-http-server"] }
rusqlite = { version = "=0.43.0", features = ["bundled"] }
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
tauri = { version = "=2.12.6", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.3"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-updater = "=2.14.1"
tauri-plugin-window-state = "=2.5.0"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
tokio = { version = "=1.54.1", features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "sync",
  "time",
] }
url = "=2.5.8"
uuid = { version = "=1.29.3", features = ["v7"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
