[package]
name = "shirushi"
version = "0.0.0"
license = "AGPL-3.0-only"
edition = "2024"
publish = false

[lib]
name = "shirushi"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[dependencies]
axum = "0.8"
local-mcp = { path = "../../../libs/local-mcp" }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "query",
  "rustls",
  "system-proxy",
] }
rmcp = { version = "3.10", features = ["macros", "server", "transport-streamable-http-server"] }
rusqlite = { version = "0.42", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "0.0.15"
tauri = { version = "2", features = [] }
tauri-plugin-localhost = "2"
tauri-plugin-single-instance = "2"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
tokio = { version = "1", features = ["macros", "net", "rt"] }
url = "2"
uuid = { version = "1", features = ["v7"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
