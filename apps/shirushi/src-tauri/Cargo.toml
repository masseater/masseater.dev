[package]
name = "shirushi"
version = "0.0.0"
license = "AGPL-3.0-only"
edition = "2024"
publish = false

[lib]
name = "shirushi"

[build-dependencies]
tauri-build = { version = "=2.7.5", features = [] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread"] }

[dependencies]
axum = "=0.8.9"
desktop-shell = { path = "../../../libs/desktop-shell" }
media-notes = { path = "../../../libs/media-notes" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
rmcp = { version = "=3.11.0", features = ["macros", "server", "transport-streamable-http-server"] }
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
tauri = { version = "=2.12.6", features = ["protocol-asset"] }
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
