[package]
name = "yogoto"
version = "0.1.0"
license = "AGPL-3.0-only"
edition = "2024"
publish = false

[lib]
name = "yogoto"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
serde_json = "=1.0.154"

[dependencies]
axum = "=0.8.9"
desktop-shell = { path = "../../../libs/desktop-shell" }
rmcp = { version = "=3.10.0", features = ["macros", "server", "transport-streamable-http-server"] }
tauri-plugin-dialog = "=2.8.4"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
audio-fetch = { path = "../../../libs/audio-fetch" }
media-notes = { path = "../../../libs/media-notes" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
schemars = "=1.2.3"
sha2 = "=0.11.1"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
tokio = { version = "=1.54.1", features = ["fs", "rt", "sync"] }
tracing = { version = "=0.1.44", features = ["log-always"] }
zip = { version = "=9.6.0", default-features = false, features = ["deflate"] }
candle-core = "=0.11.1"
flac-codec = "=1.3.3"
num-traits = "=0.2.19"
opus-rs = "=0.1.42"
roformer = { path = "../../../libs/roformer" }
rubato = "=5.1.0"
audioadapter-buffers = "=5.2.0"
beat-this = { version = "=1.1.0", default-features = false }
rten = "=0.28.0"
rten-tensor = "=0.28.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
symphonia = { version = "=0.6.1", features = ["all"] }
tauri = { version = "=2.12.5", features = ["protocol-asset"] }

[features]
cuda = ["candle-core/cuda", "roformer/cuda"]

[dev-dependencies]
opentelemetry = "=0.33.1"
opentelemetry_sdk = { version = "=0.33.1", features = ["testing"] }
tracing-opentelemetry = "=0.34.0"
tracing-subscriber = { version = "=0.3.23", features = ["registry"] }
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
