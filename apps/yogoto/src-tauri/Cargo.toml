[package]
name = "yogoto"
version = "0.0.0"
license = "AGPL-3.0-only"
edition = "2024"
publish = false

[lib]
name = "yogoto"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8"
desktop-shell = { path = "../../../libs/desktop-shell" }
rmcp = { version = "3.10", features = ["macros", "server", "transport-streamable-http-server"] }
tauri-plugin-dialog = "2"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
audio-fetch = { path = "../../../libs/audio-fetch" }
media-notes = { path = "../../../libs/media-notes" }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
schemars = "1"
sha2 = "0.11"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "0.0.15"
tokio = { version = "1", features = ["fs", "rt", "sync"] }
tracing = "0.1"
candle-core = "0.11"
flac-codec = "1.3"
num-traits = "0.2"
opus-rs = "0.1"
roformer = { path = "../../../libs/roformer" }
rubato = "5.1"
audioadapter-buffers = "5.2"
beat-this = { version = "=1.1.0", default-features = false }
rten = "0.24"
rten-tensor = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", features = ["all"] }
tauri = { version = "2", features = ["protocol-asset"] }

[features]
cuda = ["candle-core/cuda", "roformer/cuda"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
