[package]
name = "yakusu"
version = "0.1.5"
license = "AGPL-3.0-only"
edition = "2024"
publish = false

[lib]
name = "yakusu"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
dunce = "=1.0.5"
futures-util = "=0.3.34"
getrandom = "=0.4.3"
reqwest = { version = "=0.13.5", default-features = false, features = [
  "json",
  "rustls",
  "stream",
  "system-proxy",
] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-single-instance = "=2.5.5"
tokio = { version = "=1.54.1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
