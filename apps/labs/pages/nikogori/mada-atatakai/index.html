<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>まだ、あたたかい | masseater.dev</title>
    <style>
      :root {
        --wall: #1b1715;
        --wall-edge: #0f0c0b;
        --panel-shadow: rgba(0, 0, 0, 0.55);
        --bole: #5e2c1e;
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: radial-gradient(120% 90% at 50% 42%, var(--wall) 0%, var(--wall-edge) 100%)
          var(--wall-edge);
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-block: 16px;
        box-sizing: border-box;
        display: grid;
        place-items: center;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #stage {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        min-width: 0;
        min-height: 0;
      }
      #view {
        display: block;
        max-width: 100%;
        aspect-ratio: 16 / 9;
        background: var(--bole);
        box-shadow:
          0 1px 0 rgba(255, 220, 160, 0.05),
          0 18px 60px var(--panel-shadow),
          0 2px 6px var(--panel-shadow);
        cursor: crosshair;
        touch-action: none;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas
        id="view"
        tabindex="0"
        role="img"
        aria-label="金箔の地に、深い群青からあたたかい色へ移っていく抽象画。時間とともに描き足され、触れると応える。"
      ></canvas>
    </div>
    <script type="module">
      (() => {
        "use strict";
        const TAU = Math.PI * 2,
          NODASH = [];
        const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
        const lerp = (a, b, t) => a + (b - a) * t;
        const smooth = (a, b, x) => {
          x = clamp((x - a) / (b - a), 0, 1);
          return x * x * (3 - 2 * x);
        };
        const angDiff = (a, b) => {
          let d = (a - b) % TAU;
          if (d > Math.PI) d -= TAU;
          if (d < -Math.PI) d += TAU;
          return d;
        };

        function mulberry(a) {
          return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        function RNG(seed) {
          const f = mulberry(seed >>> 0);
          const o = {
            f,
            r: (a, b) => a + (b - a) * f(),
            i: (n) => Math.floor(f() * n),
            pick: (a) => a[Math.floor(f() * a.length)],
            g: () => (f() + f() + f() + f() - 2) * 0.866,
            chance: (p) => f() < p,
            fork: () => RNG((f() * 4294967296) >>> 0),
          };
          return o;
        }

        let view = document.getElementById("view");
        const stage = document.getElementById("stage");
        const reduceMotion =
          window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        const opt = {
          seed: (Math.random() * 4294967296) >>> 0,
          ff: reduceMotion ? 110 : 0,
          light: -1,
          demo: false,
        };
        for (const tok of (location.hash || "").replace("#", "").split("-")) {
          if (tok === "done") opt.ff = 110;
          else if (tok === "demo") opt.demo = true;
          else if (/^s\d+$/.test(tok)) opt.seed = +tok.slice(1) >>> 0;
          else if (/^t\d+$/.test(tok)) opt.ff = +tok.slice(1);
          else if (/^l\d$/.test(tok)) opt.light = +tok.slice(1);
        }

        const dprGuess = Math.min(window.devicePixelRatio || 1, 2);
        const PW = clamp(
          Math.round((Math.min(window.innerWidth, (window.innerHeight * 16) / 9) * dprGuess) / 32) *
            32,
          1600,
          2240,
        );
        const PH = Math.round((PW * 9) / 16);
        const U = PW / 1000;
        const cCan = document.createElement("canvas");
        cCan.width = PW;
        cCan.height = PH;
        const hCan = document.createElement("canvas");
        hCan.width = PW;
        hCan.height = PH;
        const cx = cCan.getContext("2d", { alpha: false });
        const hx = hCan.getContext("2d", { alpha: false });
        cx.lineJoin = hx.lineJoin = "round";

        let noise, fbm, core, warmSeedA, warmSeedB;
        function makeNoise(rand) {
          const p = new Uint8Array(512),
            g = new Float32Array(256);
          for (let i = 0; i < 256; i++) {
            p[i] = i;
            g[i] = rand();
          }
          for (let i = 255; i > 0; i--) {
            const j = Math.floor(rand() * (i + 1));
            const t = p[i];
            p[i] = p[j];
            p[j] = t;
          }
          for (let i = 0; i < 256; i++) p[i + 256] = p[i];
          return (x, y) => {
            const xi = Math.floor(x),
              yi = Math.floor(y);
            let fx = x - xi,
              fy = y - yi;
            fx = fx * fx * (3 - 2 * fx);
            fy = fy * fy * (3 - 2 * fy);
            const X = xi & 255,
              Y = yi & 255;
            const a = g[p[p[X] + Y]],
              b = g[p[p[X + 1] + Y]],
              c = g[p[p[X] + Y + 1]],
              d = g[p[p[X + 1] + Y + 1]];
            return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
          };
        }

        const rgb = (c) =>
          `rgb(${clamp(c[0], 0, 255) | 0},${clamp(c[1], 0, 255) | 0},${clamp(c[2], 0, 255) | 0})`;
        const mix = (a, b, t) => [
          a[0] + (b[0] - a[0]) * t,
          a[1] + (b[1] - a[1]) * t,
          a[2] + (b[2] - a[2]) * t,
        ];
        const jit = (c, amt, rng) => {
          const v = rng.g() * amt;
          return [
            c[0] + v + rng.g() * amt * 0.5,
            c[1] + v + rng.g() * amt * 0.5,
            c[2] + v + rng.g() * amt * 0.5,
          ];
        };
        const BOLE = [98, 46, 31];
        const GOLDS = [
          [206, 167, 84],
          [198, 158, 76],
          [212, 174, 92],
          [192, 150, 70],
          [208, 164, 88],
          [201, 166, 96],
        ];
        const P = {
          deep: [
            [13, 17, 38],
            [17, 23, 52],
            [21, 28, 62],
            [15, 30, 58],
          ],
          night: [
            [22, 32, 86],
            [27, 42, 108],
            [18, 27, 66],
            [38, 31, 82],
            [16, 40, 70],
            [30, 47, 124],
            [24, 28, 58],
          ],
          ultra: [
            [38, 60, 156],
            [46, 74, 172],
            [58, 86, 176],
            [30, 48, 128],
            [26, 74, 104],
            [72, 62, 150],
          ],
          trans: [
            [98, 68, 120],
            [144, 86, 114],
            [80, 50, 96],
            [132, 112, 150],
            [164, 80, 72],
            [178, 106, 122],
            [116, 84, 136],
          ],
          warm: [
            [224, 122, 90],
            [216, 86, 54],
            [236, 166, 106],
            [238, 180, 68],
            [231, 152, 148],
            [228, 138, 62],
            [240, 150, 120],
          ],
          light: [
            [244, 231, 200],
            [246, 219, 196],
            [243, 216, 146],
            [246, 237, 180],
            [248, 242, 229],
            [250, 227, 208],
          ],
          candy: [
            [42, 166, 160],
            [232, 80, 138],
            [244, 214, 52],
            [47, 95, 208],
            [240, 120, 40],
            [120, 190, 96],
          ],
          crayon: [
            [247, 239, 222],
            [224, 72, 42],
            [246, 216, 62],
            [52, 92, 204],
            [236, 98, 150],
            [44, 170, 164],
          ],
          syrup: [
            [226, 140, 58],
            [214, 96, 70],
            [232, 170, 80],
            [200, 84, 96],
          ],
        };

        function warmth(x, y) {
          const X = x / PH,
            Y = y / PH;
          const dx = (X - core.x) * 0.8,
            dy = (Y - core.y) * 1.06;
          let d = Math.hypot(dx, dy);
          d += (fbm(X * 1.9 + warmSeedA, Y * 1.9 + warmSeedB) - 0.5) * 0.46;
          d += (noise(X * 6.3 + 3.1, Y * 6.3 + warmSeedA) - 0.5) * 0.1;
          const p2 = Math.hypot((X - core.px) * 1.0, (Y - core.py) * 1.0);
          d = Math.min(d, 0.5 + p2 * 1.5);
          return smooth(0.92, 0.1, d);
        }
        function flowAng(x, y) {
          const X = x / PH,
            Y = y / PH;
          const dx = X - core.x,
            dy = Y - core.y,
            d = Math.hypot(dx * 0.8, dy * 1.06);
          const ta = Math.atan2(dy, dx) + (Math.PI / 2) * core.spin;
          const ba =
            core.drift +
            (fbm(X * 1.15 + 11.3, Y * 1.15 + 5.7) - 0.5) * 4.4 +
            (noise(X * 3.7 + 1.7, Y * 3.7 + 8.8) - 0.5) * 0.9;
          const wt = 0.46 * smooth(0.8, 0.3, d) * (0.5 + noise(X * 2.1 + 31, Y * 2.1 + 17)) + 0.05;
          return Math.atan2(
            Math.sin(ta) * wt + Math.sin(ba) * (1 - wt),
            Math.cos(ta) * wt + Math.cos(ba) * (1 - wt),
          );
        }
        function drift(x, y) {
          return smooth(
            0.56,
            0.66,
            fbm((x / PH) * 0.85 + warmSeedB * 1.3 + 40, (y / PH) * 0.85 + warmSeedA * 0.7 + 9),
          );
        }
        function tooth(x, y) {
          return (
            0.62 * noise(x / (1.25 * U) + 91.7, y / (1.25 * U) + 13.1) +
            0.38 * noise(x / (4.1 * U) + 7.7, y / (4.1 * U) + 55.3)
          );
        }
        function paletteAt(w, rng) {
          if (w < 0.16) return rng.chance(0.45) ? P.deep : P.night;
          if (w < 0.36) return rng.chance(0.7) ? P.night : P.ultra;
          if (w < 0.52) return rng.chance(0.6) ? P.trans : rng.chance(0.5) ? P.ultra : P.warm;
          if (w < 0.78) return rng.chance(0.72) ? P.warm : rng.chance(0.5) ? P.trans : P.light;
          return rng.chance(0.8) ? P.light : P.warm;
        }
        function samplePos(rng, wfn, tries) {
          let bx = 0,
            by = 0,
            bw = -1;
          for (let i = 0; i < (tries || 24); i++) {
            const x = rng.r(-0.03, 1.03) * PW,
              y = rng.r(-0.04, 1.04) * PH;
            const w = wfn(x, y);
            if (rng.f() < w) return [x, y];
            if (w > bw) {
              bw = w;
              bx = x;
              by = y;
            }
          }
          return [bx, by];
        }

        function polyPath(pts) {
          const p = new Path2D();
          p.moveTo(pts[0][0], pts[0][1]);
          for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]);
          p.closePath();
          return p;
        }
        function deform(pts, depth, vr, rng) {
          let p = pts;
          for (let d = 0; d < depth; d++) {
            const np = [],
              m = p.length;
            for (let i = 0; i < m; i++) {
              const a = p[i],
                b = p[(i + 1) % m];
              const l = Math.hypot(b[0] - a[0], b[1] - a[1]);
              np.push(a, [
                (a[0] + b[0]) / 2 + rng.g() * l * vr,
                (a[1] + b[1]) / 2 + rng.g() * l * vr,
              ]);
            }
            p = np;
          }
          return p;
        }
        function blob(x, y, r, rng, n, sx) {
          const b = [];
          n = n || 9;
          for (let i = 0; i < n; i++) {
            const a = (i / n) * TAU + rng.f() * 0.4,
              rr = r * (0.72 + 0.56 * rng.f());
            b.push([x + Math.cos(a) * rr * (sx || 1), y + Math.sin(a) * rr]);
          }
          return b;
        }
        function fieldPath(x, y, len, step, rng, wob, flip, angFn) {
          const pts = [[x, y]];
          angFn = angFn || flowAng;
          let a = angFn(x, y) + (flip ? Math.PI : 0);
          for (let s = 0; s < len; s += step) {
            const ta = angFn(x, y) + (flip ? Math.PI : 0);
            a += angDiff(ta, a) * 0.35 + rng.g() * wob;
            x += Math.cos(a) * step;
            y += Math.sin(a) * step;
            pts.push([x, y]);
          }
          return pts;
        }
        function normals(pts) {
          const n = pts.length,
            nx = new Float32Array(n),
            ny = new Float32Array(n);
          for (let i = 0; i < n; i++) {
            const a = pts[Math.max(0, i - 1)],
              b = pts[Math.min(n - 1, i + 1)];
            const dx = b[0] - a[0],
              dy = b[1] - a[1],
              l = Math.hypot(dx, dy) || 1;
            nx[i] = -dy / l;
            ny[i] = dx / l;
          }
          return [nx, ny];
        }

        function* brush(pts, o, rng) {
          const n = pts.length;
          if (n < 3) return;
          const W = o.w,
            nb = Math.max(6, Math.round(W / (1.15 * U)));
          const A = o.c1,
            B = o.c2 || o.c1,
            C3 = o.c3 || A;
          const sN = rng.f() * 200,
            dry = o.dry || 0;
          const br = [];
          for (let i = 0; i < nb; i++) {
            const u = ((i + 0.5) / nb) * 2 - 1;
            const m = clamp(noise(sN + u * 1.9, 3.3) * 1.5 - 0.25, 0, 1);
            let col = m < 0.5 ? mix(A, B, m * 2) : mix(B, C3, (m - 0.5) * 2);
            const v = 1 + rng.g() * 0.075;
            col = [col[0] * v, col[1] * v, col[2] * v];
            const hv = clamp(
              Math.round(
                255 *
                  o.thick *
                  (1 - 0.55 * dry) *
                  (0.5 + 0.34 * noise(sN + 40 + u * 3.3, 1.7) + 0.16 * rng.f() + 0.12 * rng.g()) *
                  (1 - 0.55 * u * u * u * u),
              ),
              14,
              250,
            );
            const dash = [];
            if (dry > 0.12) {
              const m = 6 + 2 * rng.i(4);
              for (let q = 0; q < m; q++)
                dash.push(
                  q & 1
                    ? (0.3 + Math.pow(rng.f(), 3) * 30 * dry * dry) * U
                    : (9 + Math.pow(rng.f(), 1.4) * 170 * (1.25 - dry)) * U,
                );
            }
            br.push({
              u: u + rng.g() * 0.03,
              css: rgb(col),
              hcss: `rgb(${hv},0,${(o.gloss || 60) | 0})`,
              run: (1.3 - dry) * (0.5 + 0.95 * rng.f()),
              ph: rng.f() * 60,
              lw: (W / nb) * (1.25 + rng.f() * 1.5) * (1 - 0.4 * dry),
              a: o.alpha * (0.62 + 0.38 * rng.f()) * (1 - 0.25 * dry * rng.f()),
              sh: rng.g() * Math.min(16 * U, W * 0.4),
              dash,
              dof: rng.f() * 200 * U,
            });
          }
          const [nx, ny] = normals(pts);
          const CH = 3,
            wv = rng.f() * 40;
          for (let k = 0; k < n - 1; k += CH) {
            const k1 = Math.min(n - 1, k + CH);
            cx.lineCap = hx.lineCap = "butt";
            const t = (k + CH * 0.5) / (n - 1);
            for (let bi = 0; bi < nb; bi++) {
              const b = br[bi];
              let a = b.a;
              if (t > b.run) a *= Math.max(0, 1 - (t - b.run) / 0.2);
              a *= smooth(
                dry * 0.42 - 0.12,
                dry * 0.42 + 0.14,
                noise(b.ph + t * n * 0.07, b.ph * 1.7 + b.u * 0.8),
              );
              if (a < 0.035) continue;
              const path = new Path2D();
              for (let j = k; j <= k1; j++) {
                const tj = j / (n - 1);
                const pr =
                  0.36 +
                  0.64 *
                    smooth(0, 0.12, tj) *
                    smooth(1.02, 0.8, tj) *
                    (0.66 + 0.6 * noise(wv + tj * n * 0.045, 9.1));
                const off = b.u * W * 0.5 * pr;
                const wb = (noise(b.ph * 3.1 + j * 0.31, b.ph) - 0.5) * 2.2 * U;
                const x = pts[j][0] + nx[j] * (off + wb) + ny[j] * b.sh,
                  y = pts[j][1] + ny[j] * (off + wb) - nx[j] * b.sh;
                if (j === k) path.moveTo(x, y);
                else path.lineTo(x, y);
              }
              cx.setLineDash(b.dash);
              hx.setLineDash(b.dash);
              cx.lineDashOffset = hx.lineDashOffset = b.dof - k * 6 * U;
              cx.globalAlpha = a;
              cx.strokeStyle = b.css;
              cx.lineWidth = b.lw;
              cx.stroke(path);
              hx.globalAlpha = Math.min(1, a * 1.08);
              hx.strokeStyle = b.hcss;
              hx.lineWidth = b.lw;
              hx.stroke(path);
            }
            cx.globalAlpha = hx.globalAlpha = 1;
            cx.setLineDash(NODASH);
            hx.setLineDash(NODASH);
            yield o.dt || 0.012;
          }
        }

        function dab(x, y, ang, len, w, col, rng, thick) {
          const nb = Math.max(3, Math.round(w / (1.0 * U)));
          const ca = Math.cos(ang),
            sa = Math.sin(ang),
            bend = rng.g() * 0.22 * len;
          cx.lineCap = hx.lineCap = "round";
          const th = (thick == null ? 0.8 : thick) * 0.62;
          let ex = x,
            ey = y;
          for (let i = 0; i < nb; i++) {
            const u = ((i + 0.5) / nb) * 2 - 1,
              off = u * w * 0.5 + rng.g() * 0.25 * U;
            const l = len * (0.5 + 0.7 * rng.f()) * (1 - 0.45 * u * u),
              s0 = -l / 2 + rng.g() * len * 0.16;
            const x0 = x + ca * s0 - sa * off,
              y0 = y + sa * s0 + ca * off;
            const x1 = x + ca * (s0 + l) - sa * off,
              y1 = y + sa * (s0 + l) + ca * off;
            const mx = (x0 + x1) / 2 - sa * bend,
              my = (y0 + y1) / 2 + ca * bend;
            const path = new Path2D();
            path.moveTo(x0, y0);
            path.quadraticCurveTo(mx, my, x1, y1);
            const v = 1 + rng.g() * 0.09;
            const lw = (w / nb) * (1.4 + rng.f() * 1.1);
            cx.strokeStyle = rgb([col[0] * v, col[1] * v, col[2] * v]);
            cx.globalAlpha = 0.55 + 0.42 * rng.f();
            cx.lineWidth = lw;
            cx.stroke(path);
            hx.strokeStyle = `rgb(${clamp(255 * th * (0.55 + 0.45 * rng.f()), 20, 250) | 0},0,${90 + rng.i(90)})`;
            hx.globalAlpha = 0.85;
            hx.lineWidth = lw;
            hx.stroke(path);
            if (i === nb >> 1) {
              ex = x1;
              ey = y1;
            }
          }
          hx.globalAlpha = 0.35;
          hx.fillStyle = `rgb(${clamp(255 * th * 1.5, 30, 250) | 0},0,150)`;
          hx.beginPath();
          hx.arc(ex - ca * w * 0.3, ey - sa * w * 0.3, Math.max(0.7 * U, w * 0.22), 0, TAU);
          hx.fill();
          cx.globalAlpha = hx.globalAlpha = 1;
        }

        function* wash(x, y, r, col, layers, alpha, rng, o) {
          o = o || {};
          const base = deform(blob(x, y, r, rng, 9, o.sx), 3, 0.5, rng);
          for (let l = 0; l < layers; l++) {
            const k = 0.34 + 0.86 * Math.pow(rng.f(), 0.8);
            const p = deform(
              base.map((q) => [x + (q[0] - x) * k, y + (q[1] - y) * k]),
              3,
              0.55,
              rng,
            );
            cx.globalAlpha = alpha;
            cx.fillStyle = rgb(jit(col, 7, rng));
            if (o.mode) cx.globalCompositeOperation = o.mode;
            cx.fill(polyPath(p));
            cx.globalCompositeOperation = "source-over";
            cx.globalAlpha = 1;
            yield o.dt || 0.05;
          }
          for (let k = 0; k < (o.rim || 0); k++) {
            const p = deform(base, 3, 0.2 + 0.12 * k, rng);
            cx.globalAlpha = alpha * 1.2;
            cx.strokeStyle = rgb(mix(col, [30, 20, 30], 0.35));
            cx.lineWidth = (0.8 + k * 0.5) * U;
            cx.stroke(polyPath(p));
            cx.globalAlpha = 1;
          }
        }

        function leafTile(tx, ty, s, rng) {
          const h = s / 2,
            rot = rng.g() * 0.02,
            cr = Math.cos(rot),
            sr = Math.sin(rot);
          const cs = [
            [-h, -h],
            [h, -h],
            [h, h],
            [-h, h],
          ].map((c) => {
            const x = c[0] + rng.g() * s * 0.012,
              y = c[1] + rng.g() * s * 0.012;
            return [tx + x * cr - y * sr, ty + x * sr + y * cr];
          });
          const poly = [];
          for (let e = 0; e < 4; e++) {
            const a = cs[e],
              b = cs[(e + 1) % 4];
            for (let k = 0; k < 7; k++) {
              const t = k / 7;
              poly.push([

          muted = false;
        function initAudio() {
          if (ac) {
            if (ac.state === "suspended") ac.resume().catch(() => {});
            return;
          }
          try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            ac = new AC();
            const len = ac.sampleRate * 3,
              buf = ac.createBuffer(1, len, ac.sampleRate),
              d = buf.getChannelData(0);
            let b0 = 0,
              b1 = 0;
            for (let i = 0; i < len; i++) {
              const w = Math.random() * 2 - 1;
              b0 = 0.985 * b0 + 0.015 * w;
              b1 = 0.6 * b1 + 0.4 * w;
              d[i] =
                (b1 * 0.7 + b0 * 3.2 + w * 0.15) *
                (0.7 + 0.3 * Math.sin(i * 0.0021) * Math.sin(i * 0.00037));
            }
            const src = ac.createBufferSource();
            src.buffer = buf;
            src.loop = true;
            sBand = ac.createBiquadFilter();
            sBand.type = "bandpass";
            sBand.frequency.value = 2400;
            sBand.Q.value = 0.6;
            const hp = ac.createBiquadFilter();
            hp.type = "highpass";
            hp.frequency.value = 500;
            sGain = ac.createGain();
            sGain.gain.value = 0;
            src.connect(sBand);
            sBand.connect(hp);
            hp.connect(sGain);
            sGain.connect(ac.destination);
            src.start();
          } catch (err) {
            ac = null;
          }
        }
        function audioTick() {
          if (!ac || !sGain) return;
          const lvl = muted ? 0 : Math.min(0.11, ptr.speed * 0.1 + autoScratch * 0.014);
          sGain.gain.setTargetAtTime(lvl, ac.currentTime, 0.04);
          sBand.frequency.setTargetAtTime(
            1700 + 2600 * ptr.speed + 500 * autoScratch,
            ac.currentTime,
            0.06,
          );
        }

        const VS =
          "attribute vec2 p;varying vec2 v;void main(){v=p*0.5+0.5;gl_Position=vec4(p,0.,1.);}";
        const FS = `precision highp float;
uniform sampler2D uC,uH;uniform vec2 uTex;uniform vec3 uL;uniform float uDawn,uT,uHour;varying vec2 v;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
vec2 gn(vec2 p){const float e=.7;return vec2(vn(p+vec2(e,0.))-vn(p-vec2(e,0.)),vn(p+vec2(0.,e))-vn(p-vec2(0.,e)));}
void main(){
 vec2 t=1./uTex;vec3 alb=texture2D(uC,v).rgb;vec4 hm=texture2D(uH,v);
 vec2 o=t*1.35;
 float a00=texture2D(uH,v+vec2(-o.x,-o.y)).r,a10=texture2D(uH,v+vec2(0.,-o.y)).r,a20=texture2D(uH,v+vec2(o.x,-o.y)).r;
 float a01=texture2D(uH,v+vec2(-o.x,0.)).r,a21=texture2D(uH,v+vec2(o.x,0.)).r;
 float a02=texture2D(uH,v+vec2(-o.x,o.y)).r,a12=texture2D(uH,v+vec2(0.,o.y)).r,a22=texture2D(uH,v+vec2(o.x,o.y)).r;
 vec2 g=vec2((a20+2.*a21+a22)-(a00+2.*a01+a02),(a02+2.*a12+a22)-(a00+2.*a10+a20))*.36;
 float gold=smoothstep(.34,.72,hm.g);
 vec2 p=v*uTex*(1600./uTex.x);
 vec2 mg=gn(p*.62)*.5+gn(p*1.9)*.32;
 vec3 L=normalize(uL);
 vec3 V=normalize(vec3((.5-v)*vec2(1.78,1.)*.5,1.));
 vec3 Hh=normalize(L+V);
 vec3 N=normalize(vec3(-g*2.1-mg*.42,1.));
 float sh=clamp(1.+dot(N.xy,L.xy)*1.25-(1.-N.z)*.22,.55,1.45);
 float gran=1.+(vn(p*1.05)-.5)*.11+(vn(p*.21)-.5)*.05;
 float sp=pow(max(dot(N,Hh),0.),34.)*(.03+.22*hm.b);
 vec3 paint=alb*sh*gran+sp*vec3(1.,.97,.9);
 // azurite and malachite are crushed stone: the coarse grains flash
 vec2 cell=floor(p*.62);float hc=hash(cell);
 vec2 ct=vec2(hash(cell+7.3),hash(cell+19.1))-.5;
 float sparkle=step(.965,hc)*pow(max(dot(normalize(vec3(N.xy+ct*1.1,1.)),Hh),0.),70.);
 paint+=sparkle*.5*smoothstep(.05,.3,hm.r)*(alb+.25);
 float a=hm.b*18.85;float mag=.03+.11*fract(hm.b*5.37);
 vec2 cr=gn(p*.022)*.5+gn(p*.085)*.16+gn(p*.4)*.05;
 vec3 Ng=normalize(vec3(-g*.55-mg*.14+vec2(cos(a),sin(a))*mag+cr*.2,1.));
 float sg=max(dot(Ng,Hh),0.);
 float lum=dot(alb,vec3(.3,.55,.15));
 float bro=pow(sg,13.);vec3 goldc=alb*mix(vec3(.62,.50,.36),vec3(1.17,1.08,.9),bro)+vec3(1.,.9,.64)*pow(sg,120.)*.4*smoothstep(.05,.6,lum);
 goldc*=1.+(vn(p*.9)-.5)*.05;
 vec3 col=mix(paint,goldc,gold);
 col*=1.+.09*dot((v-.5)*vec2(1.78,1.),L.xy);
 float d=uDawn;
 col*=mix(.84,1.02,d);
 col=mix(col*vec3(.9,.96,1.09),col*vec3(1.03,1.,.96),d);
 col*=mix(vec3(.985,.995,1.02),vec3(1.02,1.,.975),uHour);
 col=pow(col,vec3(mix(1.05,.98,d)));
 col+=(hash(gl_FragCoord.xy+fract(uT)*91.)-.5)*.012;
 gl_FragColor=vec4(col,1.);
}`;
        let gl = null,
          prog = null,
          uni = {},
          texC = null,
          texH = null,
          ctx2d = null,
          glLost = false;
        function initGL() {
          uni = {};
          try {
            gl = view.getContext("webgl", {
              antialias: false,
              alpha: false,
              powerPreference: "high-performance",
            });
          } catch (e) {
            gl = null;
          }
          if (!gl) {
            ctx2d = view.getContext("2d");
            return;
          }
          const sh = (type, src) => {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
              throw new Error(gl.getShaderInfoLog(s));
            return s;
          };
          prog = gl.createProgram();
          gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
          gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
          gl.linkProgram(prog);
          if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
            throw new Error(gl.getProgramInfoLog(prog));
          gl.useProgram(prog);
          const buf = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, buf);
          gl.bufferData(
            gl.ARRAY_BUFFER,
            new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
            gl.STATIC_DRAW,
          );
          const loc = gl.getAttribLocation(prog, "p");
          gl.enableVertexAttribArray(loc);
          gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
          for (const n of ["uC", "uH", "uTex", "uL", "uDawn", "uT", "uHour"])
            uni[n] = gl.getUniformLocation(prog, n);
          const mk = (unit) => {
            const t = gl.createTexture();
            gl.activeTexture(gl.TEXTURE0 + unit);
            gl.bindTexture(gl.TEXTURE_2D, t);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            return t;
          };
          texC = mk(0);
          texH = mk(1);
          gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
          gl.uniform1i(uni.uC, 0);
          gl.uniform1i(uni.uH, 1);
          gl.uniform2f(uni.uTex, PW, PH);
        }
        try {
          initGL();
        } catch (err) {
          gl = null;
          const c2 = view.cloneNode(false);
          view.replaceWith(c2);
          view = c2;
          ctx2d = c2.getContext("2d");
        }
        bindView();
        view.addEventListener("webglcontextlost", (e) => {
          e.preventDefault();
          glLost = true;
        });
        view.addEventListener("webglcontextrestored", () => {
          try {
            initGL();
            glLost = false;
            dirty = true;
            fit();
          } catch (err) {
            glLost = true;
          }
        });

        function fit() {
          const aw = stage.clientWidth,
            ah = stage.clientHeight;
          let w = Math.min(aw, (ah * 16) / 9),
            h = (w * 9) / 16;
          const el = view;
          el.style.width = Math.floor(w) + "px";
          el.style.height = Math.floor(h) + "px";
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const W = clamp(Math.round(w * dpr), 320, 2880),
            H = Math.round((W * 9) / 16);
          if (el.width !== W || el.height !== H) {
            el.width = W;
            el.height = H;
            dirty = true;
            forceDraw = true;
          }
          if (gl) gl.viewport(0, 0, W, H);
        }
        window.addEventListener("resize", fit);
        if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
        fit();

        const light = [0.25, 0.3],
          LIGHTS = [
            [-0.75, 0.55],
            [0.8, 0.5],
            [0, 0],
            [0.7, -0.6],
            [-0.6, -0.5],
          ];
        let lastNow = performance.now(),
          wall = 0,
          frameNo = 0;
        const hour = new Date().getHours() + new Date().getMinutes() / 60;
        const hourWarm = 0.5 + 0.5 * Math.cos(((hour - 15) / 24) * TAU);
        compose(opt.seed);

        function frame(now) {
          requestAnimationFrame(frame);
          const dt = Math.min(0.1, Math.max(0, (now - lastNow) / 1000));
          lastNow = now;
          wall += dt;
          if (paintT < ffTarget) paintT = advance(ffTarget, 26);
          else paintT = advance(paintT + dt, 9);
          holdTick(now);
          ptr.speed *= Math.pow(0.0005, dt);
          autoScratch *= Math.pow(0.001, dt);
          audioTick();

          let tx, ty;
          const idle = (now - ptr.last) / 1000;
          const dx = 0.62 * Math.sin(wall * 0.11 + 0.6) + 0.2 * Math.sin(wall * 0.047),
            dy = 0.34 * Math.cos(wall * 0.083) + 0.2;
          const k = reduceMotion ? 0 : smooth(2.5, 7, idle);
          const hxp = tilt ? tilt[0] : (ptr.x - 0.5) * 2,
            hyp = tilt ? -tilt[1] : -(ptr.y - 0.5) * 2;
          tx = lerp(hxp * 0.95, dx, k);
          ty = lerp(hyp * 0.95, dy, k);
          if (opt.light >= 0) {
            tx = LIGHTS[opt.light][0];
            ty = LIGHTS[opt.light][1];
            light[0] = tx;
            light[1] = ty;
          }
          const e = 1 - Math.pow(0.02, dt);
          light[0] += (tx - light[0]) * e;
          light[1] += (ty - light[1]) * e;
          const dawn = smooth(0, 96, paintT) * (0.955 + 0.045 * Math.sin(wall * 0.05));
          frameNo++;
          const calm = !dirty && !forceDraw && idle > 8 && !ptr.down;
          if (calm && frameNo & 1) return;
          forceDraw = false;
          if (gl && !glLost) {
            if (dirty && (ptr.down || paintT < ffTarget || (frameNo & 1) === 0)) {
              gl.activeTexture(gl.TEXTURE0);
              gl.bindTexture(gl.TEXTURE_2D, texC);
              gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, cCan);
              gl.activeTexture(gl.TEXTURE1);
              gl.bindTexture(gl.TEXTURE_2D, texH);
              gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, hCan);
              dirty = false;
            }
            gl.uniform3f(uni.uL, light[0], light[1], 0.8);
            gl.uniform1f(uni.uDawn, dawn);
            gl.uniform1f(uni.uT, wall);
            gl.uniform1f(uni.uHour, hourWarm);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          } else if (ctx2d && dirty) {
            ctx2d.drawImage(cCan, 0, 0, view.width, view.height);
            dirty = false;
          }
        }
        requestAnimationFrame(frame);

        if (opt.demo) {
          const ev = (type, x, y) => {
            const r = view.getBoundingClientRect();
            view.dispatchEvent(
              new PointerEvent(type, {
                clientX: r.left + x * r.width,
                clientY: r.top + y * r.height,
                bubbles: true,
                pointerType: "mouse",
              }),
            );
          };
          let n = 0;
          const iv = setInterval(() => {
            if (paintT < ffTarget) return;
            n++;
            if (n === 1) ev("pointerdown", 0.12, 0.3);
            else if (n < 60) ev("pointermove", 0.12 + n * 0.006, 0.3 + 0.12 * Math.sin(n * 0.25));
            else if (n === 60) window.dispatchEvent(new PointerEvent("pointerup"));
            else if (n === 70) ev("pointerdown", 0.3, 0.8);
            else if (n === 130) window.dispatchEvent(new PointerEvent("pointerup"));
            else if (n === 140) {
              ev("pointerdown", 0.85, 0.2);
              window.dispatchEvent(new PointerEvent("pointerup"));
            } else if (n > 150) clearInterval(iv);
          }, 16);
        }
      })();
    </script>
  </body>
</html>
