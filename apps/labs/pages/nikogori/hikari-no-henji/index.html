<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ひかりの返事 | masseater.dev</title>
    <style>
      :root {
        --wall: #cfc9c0;
        --shade: rgba(38, 30, 52, 0.36);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --wall: #101016;
          --shade: rgba(0, 0, 0, 0.72);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --wall: #101016;
        --shade: rgba(0, 0, 0, 0.72);
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        box-sizing: border-box;
        background: var(--wall);
        display: grid;
        place-items: center;
        overflow: hidden;
        padding-block: 16px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
      }
      canvas {
        display: block;
        width: min(100%, calc((100vh - 32px)*16/9));
        width: min(100%, calc((100dvh - 32px)*16/9));
        height: auto;
        aspect-ratio: 16/9;
        box-shadow:
          0 1px 2px var(--shade),
          0 14px 44px var(--shade);
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <canvas
      id="c"
      role="img"
      aria-label="藍色の紙にパステルで描いた水辺。ひとつきりの小さな光に、遠くから光が応え、数が増えつづけ、やがて朝の光が描き足されていく。触れると光が応える。"
    ></canvas>
    <script type="module">
      (() => {
        "use strict";

        const cv = document.getElementById("c"),
          V = cv.getContext("2d");
        const W = 1920,
          H = 1080,
          PI = Math.PI,
          TAU = PI * 2;
        const arg = (k) => {
          const m = (location.hash || "").match(new RegExp("[#&]" + k + "=([\\w.-]+)"));
          return m ? m[1] : null;
        };
        const dpr = Math.min(window.devicePixelRatio || 1, 3),
          big = Math.max(screen.width || 0, screen.height || 0) * dpr;
        const Q = +arg("q") || (big >= 2400 ? 4 / 3 : big >= 1500 ? 1 : 0.75);
        const CW = (cv.width = Math.round(W * Q)),
          CH = (cv.height = Math.round(H * Q));
        const mk = (w, h) => {
          const c = document.createElement("canvas");
          c.width = w || CW;
          c.height = h || CH;
          return c;
        };
        const cx = (c) => {
          const g = c.getContext("2d");
          g.lineCap = g.lineJoin = "round";
          return g;
        };
        V.lineCap = V.lineJoin = "round";
        const calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

        const mul = (a) => () => {
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
        let r = mul(7);
        const q = mul(99),
          z = mul((Date.now() ^ (Math.random() * 1e9)) | 0);
        const rr = (a, b) => a + (b - a) * r(),
          qq = (a, b) => a + (b - a) * q(),
          zz = (a, b) => a + (b - a) * z();
        const cl = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v),
          sm = (a, b, v) => {
            v = cl((v - a) / (b - a));
            return v * v * (3 - 2 * v);
          },
          lp = (a, b, t) => a + (b - a) * t;
        const hsh = (x, y) => {
          let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
          h = Math.imul(h ^ (h >>> 13), 1274126177);
          return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
        };
        const vn = (x, y) => {
          const xi = Math.floor(x),
            yi = Math.floor(y),
            fx = x - xi,
            fy = y - yi,
            u = fx * fx * (3 - 2 * fx),
            v = fy * fy * (3 - 2 * fy),
            a = hsh(xi, yi),
            b = hsh(xi + 1, yi),
            c = hsh(xi, yi + 1),
            d = hsh(xi + 1, yi + 1);
          return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        };
        const fbm = (x, y) =>
          vn(x, y) * 0.55 +
          vn(x * 2.1 + 7.3, y * 2.1 + 1.7) * 0.3 +
          vn(x * 4.3 + 3.1, y * 4.3 + 9.2) * 0.15;
        const hx = (h) => [
          parseInt(h.slice(1, 3), 16),
          parseInt(h.slice(3, 5), 16),
          parseInt(h.slice(5, 7), 16),
        ];
        const ca = (c, a) => "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
        const ck = (c, j) => {
          j = j == null ? 8 : j;
          const d = (q() - 0.5) * 2 * j;
          return (
            "rgb(" +
            (cl(c[0] + d + (q() - 0.5) * j, 0, 255) | 0) +
            "," +
            (cl(c[1] + d + (q() - 0.5) * j, 0, 255) | 0) +
            "," +
            (cl(c[2] + d + (q() - 0.5) * j, 0, 255) | 0) +
            ")"
          );
        };
        const pk = (R, l) => R[cl(Math.floor(l * (R.length - 1) + q()), 0, R.length - 1)];

        const TN = 512,
          tooth = new Float32Array(TN * TN);
        {
          const vt = (x, y, p) => {
            const xi = Math.floor(x),
              yi = Math.floor(y),
              fx = x - xi,
              fy = y - yi,
              u = fx * fx * (3 - 2 * fx),
              v = fy * fy * (3 - 2 * fy),
              x0 = xi % p,
              y0 = yi % p,
              x1 = (x0 + 1) % p,
              y1 = (y0 + 1) % p,
              a = hsh(x0, y0 + p * 7),
              b = hsh(x1, y0 + p * 7),
              c = hsh(x0, y1 + p * 7),
              d = hsh(x1, y1 + p * 7);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
          };
          let i = 0;
          for (let y = 0; y < TN; y++)
            for (let x = 0; x < TN; x++)
              tooth[i++] =
                0.68 * vt(x / 1.6, y / 1.6, 320) +
                0.26 * vt(x / 3.2, y / 3.2, 160) +
                0.06 * vt(x / 12.8, y / 12.8, 40);
          const hist = new Uint32Array(1024);
          for (i = 0; i < tooth.length; i++) hist[Math.min(1023, (tooth[i] * 1024) | 0)]++;
          const cdf = new Float32Array(1024);
          let acc = 0;
          for (i = 0; i < 1024; i++) {
            acc += hist[i];
            cdf[i] = acc / tooth.length;
          }
          for (i = 0; i < tooth.length; i++) tooth[i] = cdf[Math.min(1023, (tooth[i] * 1024) | 0)];
        }
        const S = mk(),
          s = cx(S);
        const CUT = [0.42, 0.62, 0.78, 0.9].map((keep) => {
          const c = mk(TN, TN),
            g = c.getContext("2d"),
            im = g.createImageData(TN, TN),
            d = im.data,
            th = 1 - keep;
          for (let i = 0; i < tooth.length; i++)
            d[i * 4 + 3] = cl((th + 0.06 - tooth[i]) / 0.12) * 255;
          g.putImageData(im, 0, 0);
          return s.createPattern(c, "repeat");
        });
        const RELIEF = (() => {
          const c = mk(TN, TN),
            g = c.getContext("2d"),
            im = g.createImageData(TN, TN),
            d = im.data;
          for (let i = 0; i < tooth.length; i++) {
            d[i * 4] = 14;
            d[i * 4 + 1] = 16;
            d[i * 4 + 2] = 34;
            d[i * 4 + 3] = cl((0.34 - tooth[i]) / 0.34) * 46;
          }
          g.putImageData(im, 0, 0);
          return s.createPattern(c, "repeat");
        })();
        function open() {
          s.setTransform(1, 0, 0, 1, 0, 0);
          s.globalCompositeOperation = "source-over";
          s.globalAlpha = 1;
          s.clearRect(0, 0, CW, CH);
          s.setTransform(Q, 0, 0, Q, 0, 0);
        }
        function shut(dst, pat, al) {
          if (pat) {
            s.setTransform(1, 0, 0, 1, 0, 0);
            s.globalCompositeOperation = "destination-out";
            s.globalAlpha = 1;
            s.fillStyle = pat;
            s.fillRect(0, 0, CW, CH);
            s.globalCompositeOperation = "source-over";
          }
          dst.setTransform(1, 0, 0, 1, 0, 0);
          dst.globalCompositeOperation = "source-over";
          dst.globalAlpha = al == null ? 1 : al;
          dst.drawImage(S, 0, 0);
          dst.globalAlpha = 1;
        }

        const paper = mk(),
          pg = cx(paper);
        {
          pg.fillStyle = "#161a30";
          pg.fillRect(0, 0, CW, CH);
          const n = mk(96, 54),
            ng = n.getContext("2d"),
            im = ng.createImageData(96, 54);
          for (let i = 0; i < 96 * 54; i++) {
            const v = fbm((i % 96) / 9, ((i / 96) | 0) / 9);
            im.data[i * 4] = v > 0.5 ? 60 : 2;
            im.data[i * 4 + 1] = v > 0.5 ? 72 : 3;
            im.data[i * 4 + 2] = v > 0.5 ? 126 : 10;
            im.data[i * 4 + 3] = Math.abs(v - 0.5) * 150;
          }
          ng.putImageData(im, 0, 0);
          pg.imageSmoothingQuality = "high";
          pg.globalAlpha = 0.55;
          pg.drawImage(n, 0, 0, CW, CH);
          pg.globalAlpha = 1;
          const c = mk(TN, TN),
            g = c.getContext("2d"),
            id = g.createImageData(TN, TN);
          for (let i = 0; i < tooth.length; i++) {
            const t = tooth[i];
            id.data[i * 4] = t > 0.5 ? 120 : 0;
            id.data[i * 4 + 1] = t > 0.5 ? 136 : 0;
            id.data[i * 4 + 2] = t > 0.5 ? 196 : 0;
            id.data[i * 4 + 3] = Math.abs(t - 0.5) * 2 * (t > 0.5 ? 24 : 70);
          }
          g.putImageData(id, 0, 0);
          pg.fillStyle = pg.createPattern(c, "repeat");
          pg.fillRect(0, 0, CW, CH);
          pg.setTransform(Q, 0, 0, Q, 0, 0);
          r = mul(5);
          for (let i = 0; i < 1100; i++) {
            const x = rr(0, W),
              y = rr(0, H);
            pg.strokeStyle = r() < 0.5 ? "rgba(84,96,150,.2)" : "rgba(4,5,12,.3)";
            pg.lineWidth = rr(0.4, 0.9);
            pg.beginPath();
            pg.moveTo(x, y);
            pg.quadraticCurveTo(x + rr(-9, 9), y + rr(-9, 9), x + rr(-15, 15), y + rr(-15, 15));
            pg.stroke();
          }
          pg.setTransform(1, 0, 0, 1, 0, 0);
        }

        const NX = new Float32Array(96),
          NY = new Float32Array(96);

        function stk(c, P, w, col, a, tp, jit, den) {
          const n = P.length >> 1;
          if (n < 2) return;
          for (let i = 0; i < n; i++) {
            const i0 = i ? i - 1 : 0,
              i1 = i < n - 1 ? i + 1 : n - 1,
              dx = P[i1 * 2] - P[i0 * 2],
              dy = P[i1 * 2 + 1] - P[i0 * 2 + 1],
              d = Math.hypot(dx, dy) || 1;
            NX[i] = -dy / d;
            NY[i] = dx / d;
          }
          const m = w < 2.2 ? 1 : Math.max(2, Math.round(w / 1.55));
          jit = jit == null ? 0.6 : jit;
          den = den || 1;
          c.strokeStyle = col;
          for (let k = 0; k < m; k++) {
            const o = m > 1 ? ((k + q() * 0.7 - 0.35) / (m - 1) - 0.5) * w : 0,
              e0 = tp ? 0 : qq(-0.2, 0.3) * (2 + w * 0.12),
              e1 = tp ? 0 : qq(-0.2, 0.3) * (2 + w * 0.12);
            c.globalAlpha = a * (m > 1 ? 0.38 + 0.62 * q() : 1);
            c.lineWidth = m > 1 ? (0.9 + q() * 1.25) * den : Math.max(0.6, w);
            c.beginPath();
            for (let i = 0; i < n; i++) {
              const t = i / (n - 1),
                f =
                  tp === 1 ? Math.pow(1 - t, 0.75) : tp === 2 ? Math.pow(Math.sin(PI * t), 0.6) : 1;
              let x = P[i * 2] + NX[i] * o * f + (q() - 0.5) * jit,
                y = P[i * 2 + 1] + NY[i] * o * f + (q() - 0.5) * jit;
              if (!i) {
                x -= NY[0] * e0;
                y += NX[0] * e0;
              } else if (i === n - 1) {
                x += NY[i] * e1;
                y -= NX[i] * e1;
              }
              i ? c.lineTo(x, y) : c.moveTo(x, y);
            }
            c.stroke();
          }
        }
        function dab(c, x, y, len, ang, w, col, a) {
          const dx = (Math.cos(ang) * len) / 2,
            dy = (Math.sin(ang) * len) / 2;
          stk(
            c,
            [
              x - dx,
              y - dy,
              x - dx * 0.4,
              y - dy * 0.4,
              x + dx * 0.4,
              y + dy * 0.4,
              x + dx,
              y + dy,
            ],
            w,
            col,
            a,
            2,
            0.5,
          );
        }
        const qb = (x0, y0, x1, y1, x2, y2, n) => {
          const o = [];
          for (let i = 0; i <= n; i++) {
            const t = i / n,
              a = (1 - t) * (1 - t),
              b = 2 * t * (1 - t),
              c = t * t;
            o.push(a * x0 + b * x1 + c * x2, a * y0 + b * y1 + c * y2);
          }
          return o;
        };
        const dabB = (c, x, y, len, ang, w, col, a) =>
          dab(c, x + (Math.cos(ang) * len) / 2, y + (Math.sin(ang) * len) / 2, len, ang, w, col, a);
        function maple(c, x, y, L, ang, col, a, vein) {
          const lob = [
            [0, 1],
            [0.62, 0.9],
            [-0.62, 0.9],
            [1.3, 0.66],
            [-1.3, 0.66],
            [2.15, 0.36],
            [-2.15, 0.36],
          ];
          for (const [da, f] of lob) {
            const aa = ang + da + (q() - 0.5) * 0.14,
              ll = L * f;
            dabB(c, x, y, ll, aa, L * 0.2 * f + 1.2, col, a);
            if (vein) {
              c.strokeStyle = vein;
              c.globalAlpha = 0.5;
              c.lineWidth = 0.8;
              c.beginPath();
              c.moveTo(x, y);
              c.lineTo(x + Math.cos(aa) * ll * 0.86, y + Math.sin(aa) * ll * 0.86);
              c.stroke();
            }
          }
          c.strokeStyle = col;
          c.globalAlpha = a * 0.8;
          c.lineWidth = 1;
          c.beginPath();
          c.moveTo(x, y);
          c.lineTo(
            x - Math.cos(ang) * L * 0.5 + qq(-2, 2),
            y - Math.sin(ang) * L * 0.5 + qq(-2, 2),
          );
          c.stroke();
        }

        const GX = 1470,
          GY = 240;
        const xl = (y) => 1420 - 1750 * Math.pow(Math.max((y - 410) / 670, 0), 0.85);
        const xr = (y) => {
          const t = Math.max((y - 410) / 670, 0);
          return 1530 + 220 * t - 760 * Math.pow(t, 1.6);
        };
        const yl = (x) => 410 + 670 * Math.pow(cl((1420 - x) / 1750, 0, 3), 1 / 0.85);
        const inWater = (x, y) => y > 414 && y < 1100 && x > xl(y) && x < xr(y);
        const farBase = (x) => (x < 1400 ? yl(x) - 26 : 428 + (x > 1540 ? (x - 1540) * 0.03 : 0));
        const gapIn = (x, y) => {
          const dx = x - GX,
            dy = y - GY,
            a = Math.atan2(dy, dx),
            k = 0.76 + 0.5 * fbm(Math.cos(a) * 1.3 + 9, Math.sin(a) * 1.3 + 3);
          return Math.hypot(dx / (205 * k), dy / (160 * k));
        };
        const TX = (t) => 232 - 64 * t - 58 * t * t + 22 * Math.sin(t * 5.2 + 0.4),
          TY = (t) => 806 - 846 * t,
          THW = (t) => 86 - 40 * t + 72 * Math.exp(-t * 11);
        const lumN = (x, y) =>
          0.1 +
          0.5 * Math.exp(-(((x - GX) / 430) ** 2 + ((y - GY) / 340) ** 2)) +
          0.22 * vn(x / 140 + 2, y / 90 + 5);
        const lumD = (x, y) => {
          const dx = x - GX,
            dy = y - GY,
            d = Math.hypot(dx, dy),
            a = Math.atan2(dy, dx);
          return Math.min(
            1,
            0.26 +
              1.05 *
                Math.exp(-d / 640) *
                (0.55 + 0.45 * fbm(Math.cos(a) * 2.2 + 5, Math.sin(a) * 2.2 + 1.7)),
          );
        };
        const lumE = (x, y) => {
          const dx = x + 260,
            dy = y + 200,
            d = Math.hypot(dx, dy),
            a = Math.atan2(dy, dx),
            beam = sm(0.4, 0.6, fbm(a * 11 + 2, 0.7)),
            dap = sm(0.44, 0.62, vn(x / 74 + 3, y / 50 + 8));
          return Math.min(
            1,
            0.15 +
              0.95 * beam * (0.32 + 0.68 * dap) * Math.exp(-d / 3400) +
              0.5 * Math.exp(-(((x - GX) / 300) ** 2 + ((y - GY) / 240) ** 2)),
          );
        };
        const colW = (x, y) =>
          Math.exp(-(((x - GX + 10) / (125 + (y - 430) * 0.9)) ** 2)) *
          Math.exp(-Math.max(0, y - 430) / 270);

        r = mul(101);
        const FTR = [
          1052, 1124, 1190, 1252, 1322, 1386, 1436, 1498, 1552, 1616, 1676, 1740, 1808, 1876,
        ].map((x0, i) => {
          const x = x0 + rr(-14, 14),
            b =
              x < 1400
                ? yl(x) - rr(6, 16)
                : x < 1545
                  ? 414 + rr(0, 4)
                  : 432 + (x - 1540) * 0.05 + rr(0, 10),
            thick = i === 4 || i === 9;
          const w =
              (thick ? rr(24, 30) : x > 1360 && x < 1580 ? rr(5, 10) : rr(9, 20)) *
              (1 + Math.max(0, b - 430) / 110),
            br = [];
          for (let k = 0, n = 1 + ((r() * 3) | 0); k < n; k++)
            br.push({
              t: rr(0.04, 0.5),
              d: r() < 0.5 ? -1 : 1,
              len: rr(40, 120),
              w: rr(1.4, 3.6),
              c: rr(0.15, 0.5),
            });
          return { x, b, w, ln: rr(-0.09, 0.09), sd: r() * 9, br };
        });
        const FTL = [];
        for (let i = 0; i < 11; i++) {
          const x = rr(300, 1010);
          FTL.push({ x, b: yl(x) - rr(30, 70), w: rr(5, 13), ln: rr(-0.07, 0.07), sd: r() * 9 });
        }
        const BRS = [
          {
            p: [
              [150, 330],
              [232, 262],
              [340, 204],
              [462, 164],
              [598, 138],
              [744, 122],
              [884, 120],
              [1016, 132],
            ],
            w: 34,
          },
          {
            p: [
              [340, 204],
              [392, 140],
              [452, 84],
              [530, 30],
              [600, -14],
            ],
            w: 13,
          },
          {
            p: [
              [598, 138],
              [668, 176],
              [730, 226],
              [772, 282],
            ],
            w: 11,
          },
          {
            p: [
              [744, 122],
              [800, 70],
              [842, 10],
            ],
            w: 9,
          },
          {
            p: [
              [462, 164],
              [500, 220],
              [520, 286],
            ],
            w: 8,
          },
          {
            p: [
              [884, 120],
              [950, 170],
              [1000, 230],
            ],
            w: 7,
          },
          {
            p: [
              [232, 262],
              [262, 330],
              [270, 400],
            ],
            w: 10,
          },
        ];
        const BL = [];
        for (const B of BRS) {
          for (let i = 1; i < B.p.length; i++) {
            B.p[i][0] += rr(-6, 6);
            B.p[i][1] += rr(-6, 6);
          }
          for (let i = 1; i < B.p.length; i++) {
            const a = B.p[i - 1],
              b = B.p[i],
              n = Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / 7);
            if (B.w > 20 && i < 3) continue;
            for (let k = 0; k < n; k++) {
              const t = r();
              BL.push({
                x: lp(a[0], b[0], t) + rr(-48, 48),
                y: lp(a[1], b[1], t) + rr(-30, 52),
                L: rr(13, 25),
                a: PI / 2 + rr(-1.25, 1.25),
              });
            }
          }
        }
        const FR = [];
        for (let k = 0; k < 17; k++) {
          const x0 = 250 + k * 103 + rr(-36, 36),
            over = x0 > 1290 && x0 < 1660,
            hang = (over ? rr(50, 110) : rr(90, 250)) * (x0 > 1700 ? 1.2 : 1);
          let x = x0,
            y = -14,
            a = PI / 2 + rr(-0.5, 0.5);
          const p = [x, y],
            lv = [];
          for (let i = 1; i <= 6; i++) {
            a += rr(-0.28, 0.28);
            x += (Math.cos(a) * hang) / 6;

        function enter(n) {

        const toL = (e) => {

                if (Math.abs(Math.hypot(d.x - w.x, d.y - w.y) - w.rad) < 70) glintAt(d, gh);
              }
          }
          if (dayK > 0.3)
            for (const f of F) if (f.mine && z() < 0.07) glintAt({ x: f.x, y: f.y, s: 1.3 }, gh);

          open();
          s.setTransform(1, 0, 0, 1, 0, 0);
          s.drawImage(dust, 0, 0);
          s.drawImage(trail, 0, 0);
          s.setTransform(Q, 0, 0, Q, 0, 0);
          for (const f of DR) {
            const R = (14 + 32 * f.z) * (0.75 + 0.5 * f.b) * (f.lone ? 1.8 : f.mine ? 1.12 : 1);
            for (let k = 0; k < 2; k++) {
              s.globalAlpha = cl(f.b * (k ? 0.45 : 0.7));
              s.save();
              s.translate(f.x + zz(-1.5, 1.5), f.y + zz(-1.5, 1.5));
              s.rotate(z() * TAU);
              const rk = k ? R * 0.55 : R;
              s.drawImage(HAL[f.hue][(z() * 5) | 0], -rk, -rk, rk * 2, rk * 2);
              s.restore();
            }
          }
          for (const g of GL) {
            const e = Math.pow(Math.sin((PI * (g.life + 0.5)) / g.max), 0.8),
              R = g.R * e * 1.1;
            s.globalAlpha = 0.42 * e;
            s.drawImage(HAL[g.hue][(z() * 5) | 0], g.x - R, g.y - R, R * 2, R * 2);
          }
          shut(V, CUT[1]);
          V.setTransform(Q, 0, 0, Q, 0, 0);
          for (const f of DR) {
            const sz = (2.1 + 4.4 * f.z) * (f.lone ? 1.3 : 1),
              a = cl(f.b * 1.25),
              dx = f.x - f.px,
              dy = f.y - f.py,
              d = Math.hypot(dx, dy) || 1,
              ux = (dx / d) * sz * 0.8 + zz(-0.5, 0.5),
              uy = (dy / d) * sz * 0.8 + zz(-0.5, 0.5),
              h = HUE[f.hue];
            V.strokeStyle = ca(h[1], 1);
            V.globalAlpha = a * 0.8;
            V.lineWidth = sz * 1.25;
            V.beginPath();
            V.moveTo(f.x - ux, f.y - uy);
            V.lineTo(f.x + ux, f.y + uy);
            V.stroke();
            V.strokeStyle = ca(h[0], 1);
            V.globalAlpha = a;
            V.lineWidth = sz * 0.7;
            V.beginPath();
            V.moveTo(f.x - ux * 0.6 + zz(-0.5, 0.5), f.y - uy * 0.6 + zz(-0.5, 0.5));
            V.lineTo(f.x + ux * 0.6, f.y + uy * 0.6);
            V.stroke();
          }
          if (lit > 0) {
            V.fillStyle = "#fff";
            for (let i = 0, n = Math.round(38 * gk); i < n; i++) {
              const d = DEW[(z() * lit) | 0];
              V.globalAlpha = zz(0.45, 1) * gk;
              V.beginPath();
              V.arc(d.x + zz(-0.4, 0.4), d.y + zz(-0.4, 0.4), (0.8 + 1.5 * z()) * d.s, 0, TAU);
              V.fill();
            }
          }
          if (dayK > 0.3)
            for (const f of F)
              if (f.mine) {
                V.fillStyle = ca(HUE[gh][0], 1);
                V.globalAlpha = zz(0.6, 1) * dayK;
                V.beginPath();
                V.arc(f.x + zz(-0.5, 0.5), f.y + zz(-0.5, 0.5), zz(1.6, 2.8), 0, TAU);
                V.fill();
              }
          for (let i = GL.length - 1; i >= 0; i--) {
            const g = GL[i],
              e = Math.pow(Math.sin((PI * (g.life + 0.5)) / g.max), 0.8),
              R = g.R * e,
              col = ca(HUE[g.hue][0], 1),
              c2 = ca(HUE[g.hue][1], 1);
            dab(V, g.x, g.y, R * 2.2 * g.ar, g.ro, Math.max(1.4, R * 0.1), col, 0.95);
            dab(V, g.x, g.y, (R * 2.2) / g.ar, g.ro + PI / 2, Math.max(1.4, R * 0.1), col, 0.95);
            dab(V, g.x, g.y, R * 0.95, g.ro + PI / 4, Math.max(1, R * 0.06), c2, 0.6);
            dab(V, g.x, g.y, R * 0.95, g.ro - PI / 4, Math.max(1, R * 0.06), c2, 0.6);
            V.fillStyle = col;
            V.globalAlpha = 1;
            V.beginPath();
            V.arc(g.x, g.y, Math.max(1, R * 0.09), 0, TAU);
            V.fill();
            if (++g.life >= g.max) GL.splice(i, 1);
          }
          if (dayK > 0)
            for (const m of MO) {
              m.vx *= 0.9;
              m.vy *= 0.9;
              if (ptr.on) {
                const dx = ptr.x - m.x,
                  dy = ptr.y - m.y,
                  d = Math.hypot(dx, dy) + 1;
                if (d < 240) {
                  m.vx += (-dy / d) * 90 * dt;
                  m.vy += (dx / d) * 90 * dt;
                }
              }
              m.x += ((vn(m.sd + tl * 0.2, m.y / 150) - 0.5) * 30 + m.vx) * dt;
              m.y += ((vn(m.sd * 2 - tl * 0.17, m.x / 170) - 0.5) * 20 - 5 + m.vy) * dt;
              if (m.y < -10) {
                m.y = H + 8;
                m.x = zz(0, W);
              }
              if (m.x < -10) m.x = W + 8;
              if (m.x > W + 10) m.x = -8;
              const L = eveK > 0.5 ? lumE(m.x, m.y) : lumD(m.x, m.y),
                a = dayK * cl((L - 0.42) * 2.2) * (0.35 + 0.65 * z()) * (eveK > 0.5 ? 1 : 0.55);
              if (a < 0.05) continue;
              V.strokeStyle = eveK > 0.5 ? "#ffe9a8" : "#fff3e0";
              V.globalAlpha = a;
              V.lineWidth = m.sz;
              V.beginPath();
              V.moveTo(m.x, m.y);
              V.lineTo(m.x + zz(-1.6, 1.6), m.y + zz(-1.6, 1.6));
              V.stroke();
            }
          V.globalAlpha = 1;
        }

        const still = arg("s"),
          jump = arg("t");
        let last = 0,
          acc = 0,
          ready = 0;
        function frame(now) {
          requestAnimationFrame(frame);
          const dt = last ? Math.min(0.2, (now - last) / 1000) : 0;
          last = now;
          if (!done.n) {
            work(24);
            V.setTransform(1, 0, 0, 1, 0, 0);
            V.drawImage(night, 0, 0);
            return;
          }
          if (!ready) {
            ready = 1;
            if (still || jump) work(1e9);
            if (still) {
              V.setTransform(1, 0, 0, 1, 0, 0);
              V.drawImage(still === "dawn" ? dawn : still === "eve" ? eve : night, 0, 0);
              cv.dataset.done = "1";
              return;
            }
            if (jump) tl = +jump;
            for (const p of store.m) addMine(p[0], p[1], 1);
          }
          if (still) return;
          if (ji < jobs.length) work(5);
          acc += dt;
          if (acc < 1 / 12) return;
          const d = Math.min(acc, 0.2);
          acc = 0;
          step(d);
          cv.dataset.done = "1";
        }
        V.drawImage(paper, 0, 0);
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
