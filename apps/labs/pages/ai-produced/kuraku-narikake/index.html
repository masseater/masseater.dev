      const eventOf = (entry) => {
        const placed = {
          track: entry.tr,
          sample: entry.s,
          start: entry.t,
          duration: entry.d,
          gain: entry.g,
          offset: entry.off ?? 0,
          reversed: Boolean(entry.rev),
        };
        if (entry.m === null) {
          return { ...placed, kind: "hit" };
        }
        return {
          ...placed,
          kind: "note",
          pitch: entry.m,
          glide: (entry.pc ?? []).map(([at, semitones]) => ({ at, semitones })),
        };
      };

      const takeOf = (log, view) => ({
        events: log.filter(Boolean).map(eventOf),
        automation: Object.entries(view.auto ?? {}).map(([name, lane]) => ({
          name,
          values: Array.from(lane.v),
          low: lane.lo,
          high: lane.hi,
          scale: lane.log ? "log" : "linear",
          unit: lane.unit === "Hz" ? "Hz" : "level",
          shade: name === SHADED,
        })),
        roots: view.roots ?? [],

      const trackWorker = (engine, song) => {
        const log = [];
        let session = null;
        self.onmessage = ({ data }) => {
          if (data.samples) {
            session = song.open(engine, data.samples, data.meta, { log, edits: false });
            self.postMessage({ ready: true });
            return;
          }
          const stem = session.track(data.name);
          const entries = log.splice(0).filter(Boolean);
          self.postMessage({ name: data.name, stem, entries }, [
            stem.data.buffer,
            stem.segs.buffer,
          ]);
        };
      };

      const workerUrl = () =>
        URL.createObjectURL(
          new Blob(
            [
              `const GEngine = (${engineModule})();\n`,
              `const GSong = (${songModule})();\n`,
              `(${trackWorker})(GEngine, GSong);\n`,
            ],
            { type: "text/javascript" },
          ),
        );

      const workerCount = () => {
        const cores = navigator.hardwareConcurrency ?? 4;
        const memory = navigator.deviceMemory ?? 8;
        const phone = /iPhone|iPad|iPod|Android/.test(navigator.userAgent);
        const limit = phone || memory < 4 ? 1 : memory < 8 ? 2 : 4;
        return Math.max(1, Math.min(cores - 1, limit));
      };

      const pause = () => new Promise((resolve) => setTimeout(resolve, 0));

      const SUMMED_FRAMES = 32768;

      const summedTape = (N) => {
        const sums = [0, 1].map(() => ({ L: new Float32Array(N), R: new Float32Array(N) }));
        return {
          frames: SUMMED_FRAMES,
          write: (slot, L, R) => {
            const sum = sums[slot];
            for (let i = 0; i < N; i++) {
              sum.L[i] += L[i];
              sum.R[i] += R[i];
            }
          },
          block: async (b) =>
            sums.map((sum) => {
              const a = b * SUMMED_FRAMES;
              const z = Math.min(N, a + SUMMED_FRAMES);
              const data = new Float32Array((z - a) * 2);
              for (let i = a, o = 0; i < z; i++) {
                data[o++] = sum.L[i];
                data[o++] = sum.R[i];
              }
              return { channels: 2, scale: 1, data };
            }),
        };
      };

      const tapeFor = async (session) => {
        try {
          const tape = await openTape({ tracks: session.tracks.length, frames: session.N });
          return {
            tape,
            live: true,
            stems: session.tracks.map((name) => ({ name, drum: false })),
            slotOf: (index) => index,
          };
        } catch {
          return {
            tape: summedTape(session.N),
            live: false,
            stems: [
              { name: "DRUMS", drum: true },
              { name: "MUSIC", drum: false },
            ],
            slotOf: (index, drum) => (drum ? 0 : 1),
          };
        }
      };

      const renderTracks = (session, samples, log, progress, held) =>
        new Promise((resolve, reject) => {
          const names = [...session.cost];
          const total = names.length;
          let done = 0;
          let settled = false;
          const workers = [];
          let url = null;

          const take = (name, stem) => {
            const index = session.tracks.indexOf(name);
            if (held.live) {
              held.stems[index].drum = Boolean(stem.drum);
            }
            const { L, R } = GEngine.unpack(stem);
            held.tape.write(held.slotOf(index, stem.drum), L, R);
            done += 1;
            progress((done / total) * TRACK_SHARE, name.toLowerCase());
          };

          const close = () => {
            for (const worker of workers) {
              worker.terminate();
            }
            if (url) {
              URL.revokeObjectURL(url);
            }
          };

          const here = async () => {
            while (names.length > 0) {
              const name = names.shift();
              await pause();
              take(name, session.track(name));
            }
          };

          const fallBack = () => {
            if (settled) {
              return;
            }
            settled = true;
            for (const worker of workers) {
              if (worker.current) {
                names.unshift(worker.current);
              }
            }
            close();
            here().then(resolve, reject);
          };

          try {
            url = workerUrl();
            for (let i = 0; i < workerCount(); i++) {
              const worker = new Worker(url);
              worker.current = null;
              workers.push(worker);
              worker.onerror = fallBack;
              worker.onmessage = ({ data }) => {
                if (settled) {
                  return;
                }
                if (!data.ready) {
                  worker.current = null;
                  for (const entry of data.entries) {
                    log.push(entry);
                  }
                  take(data.name, data.stem);
                }
                if (done === total) {
                  settled = true;
                  close();
                  resolve();
                  return;
                }
                const name = names.shift();
                if (name) {
                  worker.current = name;
                  worker.postMessage({ name });
                }
              };
              worker.postMessage({ samples, meta: META });
            }
          } catch {
            fallBack();
          }
        });

      const liveOf = (session, out, held) => ({
        tracks: session.tracks,
        player: `(init, rate, tape) => new ((${mixerModule})().Player)(init, rate, tape)`,
        init: { N: session.N, SR: GEngine.SR, stems: held.stems, par: out.par, auto: out.auto },
        transfer: Object.values(out.auto).map((curve) => curve.buffer),
        tape: held.tape,
      });

      const render = async ({ samples, report }) => {
        const log = [];
        const view = {};
        const progress = (share, label) => {
          report({ share, label, take: takeOf(log, view) });
        };
        const session = GSong.open(GEngine, samples, META, { log, view, mix: GMix });
        progress(0, "tracks");
        const held = await tapeFor(session);
        await renderTracks(session, samples, log, progress, held);
        const out = await session.master(held.stems, held.tape, progress);
        const rendered = { left: out.L, right: out.R, take: takeOf(log, view) };
        if (!held.live) {
          return rendered;
        }
        return { ...rendered, live: liveOf(session, out, held) };
      };
