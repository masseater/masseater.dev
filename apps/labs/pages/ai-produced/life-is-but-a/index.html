      const TONES = { "PLATE SEND": "faint", "DELAY SEND": "faint", EDIT: "ink" };
      const SHADED = "WALL LP";

      const eventOf = (entry) => {
        const placed = {
          track: entry.tr,
          sample: entry.s,
          start: entry.t,
          duration: entry.d,
          gain: entry.g,
          offset: entry.off ?? 0,
          reversed: Boolean(entry.rev),
        };
        if (entry.m === null) {
          return { ...placed, kind: "hit" };
        }
        return {
          ...placed,
          kind: "note",
          pitch: entry.m,
          glide: (entry.pc ?? []).map(([at, semitones]) => ({ at, semitones })),
        };
      };

      const takeOf = (log, view) => ({
        events: log.filter(Boolean).map(eventOf),
        automation: Object.entries(view.auto ?? {}).map(([name, lane]) => ({
          name,
          values: Array.from(lane.v),
          low: lane.lo,
          high: lane.hi,
          scale: lane.log ? "log" : "linear",
          unit: lane.unit === "Hz" ? "Hz" : "level",
          shade: name === SHADED,
        })),
        roots: view.roots ?? [],
      });

      const render = async ({ samples, report }) => {
        const log = [];
        const view = {};
        const progress = (share, label) => {
          report({ share, label, take: takeOf(log, view) });
        };
        const out = await GSong.render(GEngine, samples, META, progress, { log, view });
