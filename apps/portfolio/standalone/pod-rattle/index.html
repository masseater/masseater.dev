<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />

    <title>Pod Rattle | masseater.dev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link

    />
    <meta
      name="description"
      content="録音サンプルを使わず、3D衝突物理とモーダル共鳴器だけで鳴らす種子殻ラトルの物理モデリングシンセ"
    />
    <style>
      /* Layout: one-screen instrument. Stage (live simulation) fills the left; a narrow control rail on the right, stacked below on phones. */
      :root {
        --bg: #ece7df;
        --stage: #f6f2ec;
        --fg: #2a1f1a;
        --muted: #7a6a5f;
        --line: #d6ccc0;
        --pod: #6b2a1f;
        --jute: #a8926a;
        --brass: #a87b23;
        --accent: #8a3b1e;
        --flash: #d9a441;
        --track: #d9cfc3;
        --f-display: "Shippori Mincho B1", "Hiragino Mincho ProN", serif;
        --f-body: "Zen Kaku Gothic New", "Hiragino Sans", system-ui, sans-serif;
        --f-mono: "IBM Plex Mono", ui-monospace, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #17120f;
          --stage: #1f1915;
          --fg: #efe6dc;
          --muted: #a59585;
          --line: #3a2f28;
          --pod: #8e3c2a;
          --jute: #8f7b58;
          --brass: #c9973a;
          --accent: #e08a5a;
          --flash: #f2c46b;
          --track: #3a2f28;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #17120f;
        --stage: #1f1915;
        --fg: #efe6dc;
        --muted: #a59585;
        --line: #3a2f28;
        --pod: #8e3c2a;
        --jute: #8f7b58;
        --brass: #c9973a;
        --accent: #e08a5a;
        --flash: #f2c46b;
        --track: #3a2f28;
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--f-body);
        font-size: 14px;
        margin: 0;
      }
      .app {
        height: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 0;
      }
      .stage {
        position: relative;
        background: var(--stage);
        min-height: 0;
        touch-action: none;
        cursor: grab;
        overflow: hidden;
      }
      .keys {
        position: absolute;
        left: max(16px, env(safe-area-inset-left, 0px));
        bottom: 12px;
        margin: 0;
        font: 12px var(--f-mono);
        color: var(--muted);
        pointer-events: none;
        opacity: 0;
      }
      .stage:focus-visible .keys {
        opacity: 1;
      }
      .stage:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .stage:active {
        cursor: grabbing;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .title {
        position: absolute;
        left: max(16px, env(safe-area-inset-left, 0px));
        top: 14px;
        pointer-events: none;
      }
      .title h1 {
        font-family: var(--f-display);
        font-weight: 800;
        font-size: 22px;
        margin: 0;
        letter-spacing: 0.02em;
      }
      .hud {
        position: absolute;
        right: 16px;
        bottom: 12px;
        font-family: var(--f-mono);
        font-size: 12px;
        color: var(--muted);
        pointer-events: none;
        font-variant-numeric: tabular-nums;
      }
      #start {
        position: absolute;
        left: 50%;
        top: 84%;
        transform: translate(-50%, -50%);
        font: 700 16px var(--f-body);
        padding: 14px 28px;
        border-radius: 999px;
        border: 0;
        background: var(--accent);
        color: var(--stage);
        cursor: pointer;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
      }
      #start:focus-visible,
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .rail {
        border-left: 1px solid var(--line);
        padding-block: 16px;
        padding-left: 20px;
        padding-right: max(20px, env(safe-area-inset-right, 0px));
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .group {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .group h2 {
        font: 600 11px var(--f-body);
        letter-spacing: 0.12em;
        color: var(--muted);
        margin: 0;
      }
      .presets {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
      .presets button {
        font: 500 13px var(--f-body);
        padding: 7px 0;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        cursor: pointer;
      }
      .presets button[aria-pressed="true"] {
        background: var(--fg);
        color: var(--stage);
        border-color: var(--fg);
      }
      .ctl {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: baseline;
        gap: 2px 8px;
      }
      .ctl label {
        font-weight: 500;
      }
      .ctl output {
        justify-self: end;
        font: 12px var(--f-mono);
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .ctl input {
        grid-column: 1/-1;
        width: 100%;
        accent-color: var(--accent);
        margin: 2px 0 0;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .switch {
        font: 500 13px var(--f-body);
        padding: 6px 14px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        cursor: pointer;
      }
      .switch[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--stage);
      }
      @media (max-width: 760px) {
        .app {
          grid-template-columns: 1fr;
          grid-template-rows: min(58svh, 520px) auto;
          height: auto;
        }
        html,
        body {
          height: auto;
        }
        .stage {
          height: min(58svh, 520px);
        }
        .rail {
          border-left: 0;
          border-top: 1px solid var(--line);
          padding-left: max(16px, env(safe-area-inset-left, 0px));
          padding-right: max(16px, env(safe-area-inset-right, 0px));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #start {
          box-shadow: none;
        }
      }
    </style>
    <script type="module">
      function createEngine(sr, opts) {
        opts = opts || {};
        const K = 12,
          RING = 128,
          RM = RING - 1,
          SUB = 16,
          MAXP = 64,
          dt = SUB / sr,
          AUDIO = !!opts.audio;
        const P = {
          count: 28,
          material: 0.1,
          pitch: 1,
          decay: 1,
          rest: 0.5,
          len: 1,
          gain: 1,
          bright: 0,
          spread: 1,
          hiDecay: 1,
          hard: 1,
        };
        const A = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, tx: 0, ty: 0 };
        const AU = { on: true, rate: 2.6, amp: 0.5, ph: 0 };
        const F64 = () => new Float64Array(MAXP),
          FK = () => new Float64Array(MAXP * K);
        const px = F64(),
          py = F64(),
          pz = F64(),
          vx = F64(),
          vy = F64(),
          vz = F64(),
          rad = F64(),
          ms = F64(),
          Ln = F64(),
          ox = F64(),
          oz = F64(),
          sz = F64(),
          sf = F64(),
          pl = F64(),
          pr = F64();
        const sR = FK(),
          a1 = FK(),
          a2 = FK(),
          y1 = FK(),
          y2 = FK(),
          gk = FK(),
          ring = new Float64Array(MAXP * K * RING);
        const active = new Int32Array(MAXP),
          flash = new Float32Array(MAXP);
        const woodR = [1, 2.1, 3.3, 4.6, 6.0, 7.4, 8.9, 10.5, 12.2, 14.0, 16.0, 18.1],
          metR = [1, 1.594, 2.136, 2.653, 3.156, 4.21, 5.43, 6.92, 8.61, 10.73, 12.94, 15.42];
        let fTop = 0,
          n = 0,
          sub = 0,
          rp = 0,
          hits = 0,
          hitRate = 0,
          hitT = 0,
          Ecur = 3e9,
          T0cur = 0.02,
          f0cur = 2400;
        let seed = 1;
        const rnd = () => {
          seed = (seed * 1664525 + 1013904223) >>> 0;
          return seed / 4294967296;
        };
        const lerp = (a, b, t) => a + (b - a) * t,
          lg = (a, b, t) => Math.exp(lerp(Math.log(a), Math.log(b), t));
        const SCALE = 2.2;
        let matGain = 28;

        function build() {
          const old = n;
          n = Math.max(1, Math.min(MAXP, P.count | 0));
          seed = 777;
          for (let i = 0; i < n; i++) {
            const s = 0.75 + 0.5 * rnd();
            sz[i] = s;
            rad[i] = 0.016 * s;
            ms[i] = 0.004 * s * s;
            Ln[i] = 0.045 + 0.085 * rnd();
            const an = rnd() * 6.2832,
              rr = 0.004 + 0.009 * rnd();
            ox[i] = Math.cos(an) * rr;
            oz[i] = Math.sin(an) * rr;
            sf[i] = rnd();
            for (let k = 0; k < K; k++) sR[i * K + k] = rnd();
            if (i >= old) {
              px[i] = A.x + ox[i] * 4;
              py[i] = A.y - Ln[i] * P.len * 0.95;
              pz[i] = A.z + oz[i] * 4;
              vx[i] = vy[i] = vz[i] = 0;
            }
          }
          for (let i = n; i < old; i++) {
            active[i] = 0;
          }
          modes();
        }
        function modes() {
          const mt = P.material;
          f0cur = P.pitch * lg(2300, 1700, mt);
          T0cur = lg(0.022, 2.4, mt) * P.decay;
          Ecur = lg(2.5e9, 1.1e11, mt) * P.hard;
          matGain = lg(28, 3, mt);
          const pw = lerp(1.7, 0.45, mt) / P.hiDecay,
            tilt = Math.max(-0.5, lerp(0.95, 0.3, mt) - P.bright);
          fTop = 0;
          for (let i = 0; i < n; i++) {
            const f0 = (f0cur / sz[i]) * (0.92 + 0.16 * sf[i]);
            for (let k = 0; k < K; k++) {
              const id = i * K + k,
                ratio =
                  (1 + (lerp(woodR[k], metR[k], mt) - 1) * P.spread) * (1 + 0.05 * (sR[id] - 0.5)),
                f = f0 * ratio;
              if (f > 0.45 * sr) {
                a1[id] = 0;
                a2[id] = 0;
                gk[id] = 0;
                continue;
              }
              const w = (2 * Math.PI * f) / sr,
                T = T0cur / Math.pow(ratio, pw),
                r = Math.pow(10, -3 / (T * sr));
              a1[id] = 2 * r * Math.cos(w);
              a2[id] = r * r;
              gk[id] = Math.sin(w) * Math.pow(k + 1, -tilt) * (k ? lerp(0.55, 1, mt) : 1);
              if (f > fTop) fTop = f;
            }
          }
        }
        function excite(i, F, ts, off) {
          const N = Math.ceil(ts);
          for (let k = 0; k < K; k++) {
            const id = i * K + k;
            const g = gk[id];
            if (!g) continue;
            const amp = (F * g * (0.2 + 0.8 * rnd()) * SCALE * matGain) / sr,
              base = id * RING;
            for (let s = 0; s < N; s++) {
              const ph = (s + 0.5) / ts;
              if (ph >= 1) break;
              ring[base + ((rp + off + s) & RM)] += amp * Math.sin(Math.PI * ph);
            }
          }
          active[i] = Math.ceil(sr * T0cur * 1.3) + RING;
        }
        function hit(i, j, vn, J, frac) {
          hits++;
          flash[i] = Math.min(1, flash[i] + J * 30);
          flash[j] = Math.min(1, flash[j] + J * 30);
          if (!AUDIO) return;
          const me = (ms[i] * ms[j]) / (ms[i] + ms[j]),
            Es = Ecur / 1.8;
          let tau = 2.87 * Math.pow((me * me) / (0.003 * Es * Es * vn), 0.2),
            ts = tau * sr;
          if (ts < 1) {
            ts = 1;
            tau = 1 / sr;
          }
          if (ts > 48) {
            ts = 48;
            tau = 48 / sr;
          }
          const F = (J * Math.PI) / (2 * tau),
            off = Math.max(0, Math.min(SUB - 1, Math.floor(SUB * (1 - frac))));
          excite(i, F, ts, off);
          excite(j, F, ts, off);
        }
        function physics() {
          if (AU.on) {
            AU.ph += 2 * Math.PI * AU.rate * dt;
            const a = AU.amp;
            A.tx = a * 0.1 * Math.sin(AU.ph) + a * 0.012 * Math.sin(AU.ph * 2.7 + 1.3);
            A.ty = a * 0.028 * Math.sin(2 * AU.ph + 0.6);
          }
          const kk = 1 - Math.exp(-dt * 70);
          const nx = A.x + (A.tx - A.x) * kk,
            ny = A.y + (A.ty - A.y) * kk;
          A.vx = (nx - A.x) / dt;
          A.vy = (ny - A.y) / dt;
          A.vz = 0;
          A.x = nx;
          A.y = ny;
          const damp = 1 - dt * 0.35,
            e = P.rest,
            mu = 0.25;
          for (let i = 0; i < n; i++) {
            vy[i] -= 9.81 * dt;
            vx[i] *= damp;
            vy[i] *= damp;
            vz[i] *= damp;
            px[i] += vx[i] * dt;
            py[i] += vy[i] * dt;
            pz[i] += vz[i] * dt;
            const qx = A.x + ox[i],
              qy = A.y,
              qz = A.z + oz[i],
              L = Ln[i] * P.len;
            let dx = px[i] - qx,
              dy = py[i] - qy,
              dz = pz[i] - qz;
            const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
            if (d > L) {
              dx /= d;
              dy /= d;
              dz /= d;
              px[i] = qx + dx * L;
              py[i] = qy + dy * L;
              pz[i] = qz + dz * L;
              const vr = (vx[i] - A.vx) * dx + (vy[i] - A.vy) * dy + (vz[i] - A.vz) * dz;
              if (vr > 0) {
                vx[i] -= dx * vr * 1.02;
                vy[i] -= dy * vr * 1.02;
                vz[i] -= dz * vr * 1.02;
              }
            }
            // keep pods below the knot
            if (py[i] > qy - rad[i]) {
              py[i] = qy - rad[i];
              if (vy[i] > A.vy) vy[i] = A.vy;
            }
          }
          for (let i = 0; i < n; i++)
            for (let j = i + 1; j < n; j++) {
              const dx = px[i] - px[j],
                dy = py[i] - py[j],
                dz = pz[i] - pz[j],
                R = rad[i] + rad[j],
                d2 = dx * dx + dy * dy + dz * dz;
              if (d2 >= R * R || d2 < 1e-14) continue;
              const d = Math.sqrt(d2),
                nx_ = dx / d,
                ny_ = dy / d,
                nz_ = dz / d,
                ov = R - d;
              const rvx = vx[i] - vx[j],
                rvy = vy[i] - vy[j],
                rvz = vz[i] - vz[j],
                vn = rvx * nx_ + rvy * ny_ + rvz * nz_;
              const wi = 1 / ms[i],
                wj = 1 / ms[j],
                ws = wi + wj;
              px[i] += (nx_ * ov * 0.7 * wi) / ws;
              py[i] += (ny_ * ov * 0.7 * wi) / ws;
              pz[i] += (nz_ * ov * 0.7 * wi) / ws;
              px[j] -= (nx_ * ov * 0.7 * wj) / ws;
              py[j] -= (ny_ * ov * 0.7 * wj) / ws;
              pz[j] -= (nz_ * ov * 0.7 * wj) / ws;
              if (vn >= 0) continue;
              const loud = -vn > 0.05,
                J = (-(1 + (loud ? e : 0.05)) * vn) / ws;
              vx[i] += J * wi * nx_;
              vy[i] += J * wi * ny_;
              vz[i] += J * wi * nz_;
              vx[j] -= J * wj * nx_;
              vy[j] -= J * wj * ny_;
              vz[j] -= J * wj * nz_;
              const tx = rvx - vn * nx_,
                ty = rvy - vn * ny_,
                tz = rvz - vn * nz_,
                vt = Math.sqrt(tx * tx + ty * ty + tz * tz);
              if (vt > 1e-6) {
                const jt = Math.min(mu * J, vt / ws) / vt;
                vx[i] -= jt * wi * tx;
                vy[i] -= jt * wi * ty;
                vz[i] -= jt * wi * tz;
                vx[j] += jt * wj * tx;
                vy[j] += jt * wj * ty;
                vz[j] += jt * wj * tz;
              }
              if (loud) {
                const frac = Math.min(1, ov / (-vn * dt));
                hit(i, j, -vn, J, frac);
              }
            }
          for (let i = 0; i < n; i++) {
            const p = Math.max(-1, Math.min(1, px[i] / 0.12));
            const a = ((p + 1) * Math.PI) / 4;
            pl[i] = Math.cos(a);
            pr[i] = Math.sin(a);
          }
          hitT += dt;
          if (hitT >= 0.1) {
            hitRate = hitRate * 0.6 + (hits / hitT) * 0.4;
            hits = 0;
            hitT = 0;
          }
        }
        function run(Lo, Ro, len) {
          for (let s = 0; s < len; s++) {
            if (sub === 0) physics();
            if (++sub === SUB) sub = 0;
            if (!Lo) continue;
            let l = 0,
              r = 0;
            for (let i = 0; i < n; i++) {
              if (active[i] <= 0) continue;
              if (--active[i] === 0) {
                for (let k = 0; k < K; k++) {
                  y1[i * K + k] = 0;
                  y2[i * K + k] = 0;
                }
                continue;
              }
              let y = 0;
              for (let k = 0; k < K; k++) {
                const id = i * K + k,
                  b = id * RING + rp,
                  x = ring[b];
                ring[b] = 0;
                const yn = a1[id] * y1[id] - a2[id] * y2[id] + x;
                y2[id] = y1[id];
                y1[id] = yn;
                y += yn;
              }
              l += y * pl[i];
              r += y * pr[i];
            }
            rp = (rp + 1) & RM;
            const g = P.gain;
            Lo[s] = Math.tanh(l * g);
            if (Ro) Ro[s] = Math.tanh(r * g);
          }
        }
        function snapshot() {
          const st = 7,
            out = new Float32Array(6 + n * st);
          out[0] = n;
          out[1] = A.x;
          out[2] = A.y;
          out[3] = A.z;
          out[4] = hitRate;
          out[5] = P.material;
          for (let i = 0; i < n; i++) {
            const o = 6 + i * st;
            out[o] = px[i];
            out[o + 1] = py[i];
            out[o + 2] = pz[i];
            out[o + 3] = rad[i];
            out[o + 4] = flash[i];
            out[o + 5] = A.x + ox[i];
            out[o + 6] = A.z + oz[i];
            flash[i] *= 0.78;
          }
          return out;
        }
        function getState() {
          return {
            n,
            A: { ...A },
            AU: { ...AU },
            p: Array.from({ length: n }, (_, i) => [px[i], py[i], pz[i], vx[i], vy[i], vz[i]]),
          };
        }
        function msg(d) {
          if (d.type === "p") {
            const c = P.count;
            Object.assign(P, d.p);
            if ((P.count | 0) !== (c | 0) || !n) build();
            else modes();
          } else if (d.type === "target") {
            AU.on = false;
            A.tx = d.x;
            A.ty = d.y;
          } else if (d.type === "auto") {
            Object.assign(AU, d.a);
          }
        }
        function info() {
          const me = 0.002,
            Es = Ecur / 1.8,
            tau = 2.87 * Math.pow((me * me) / (0.003 * Es * Es * 1), 0.2);
          return { E: Ecur, T0: T0cur, f0: f0cur, fTop, tau };
        }
        if (opts.params) Object.assign(P, opts.params);
        if (opts.auto) Object.assign(AU, opts.auto);
        build();
        if (opts.state) {
          const s = opts.state;
          Object.assign(A, s.A);
          Object.assign(AU, s.AU, opts.auto || {});
          for (let i = 0; i < Math.min(n, s.p.length); i++) {
            [px[i], py[i], pz[i], vx[i], vy[i], vz[i]] = s.p[i];
          }
        }
        return { run, snapshot, msg, info, getState, P, AU };
      }

      const WORKLET =

          g.ellipse(0, 0, rr, rr * 0.38, 0, 0, Math.PI);
          g.closePath();
          g.fill();
          g.fillStyle = `rgb(${c.map((v) => Math.round(v * 0.45)).join(",")})`;
          g.beginPath();
          g.ellipse(0, rr * 0.02, rr * 0.86, rr * 0.28, 0, 0, Math.PI * 2);
          g.fill();
          if (fl > 0.12) {
            g.strokeStyle = flashC;
            g.globalAlpha = Math.min(1, fl);
            g.lineWidth = 2;
            g.beginPath();
            g.arc(0, 0, rr + 1.5 + fl * 3, 0, Math.PI * 2);
            g.stroke();
            g.globalAlpha = 1;
          }
          g.restore();
        }
        $("hud").textContent = `${Math.round(s[4])} hits/s`;
      }
      requestAnimationFrame(frame);

      // hand
      function toWorld(e) {
        const r = stage.getBoundingClientRect();
        const x = (e.clientX - r.left - cx) / S,
          y = (cy - (e.clientY - r.top)) / S;
        return { x, y };
      }
      let grab = null;
      stage.addEventListener("pointerdown", (e) => {
        if (e.target.id === "start") return;
        stage.setPointerCapture(e.pointerId);
        if (auto.on) setAuto(false);
        grab = { p: toWorld(e), x: snap[1], y: snap[2] };
        send({ type: "target", x: grab.x, y: grab.y });
      });
      stage.addEventListener("pointermove", (e) => {
        if (!grab || !stage.hasPointerCapture(e.pointerId)) return;
        const p = toWorld(e);
        send({
          type: "target",
          x: Math.max(-0.3, Math.min(0.3, grab.x + p.x - grab.p.x)),
          y: Math.max(-0.2, Math.min(0.12, grab.y + p.y - grab.p.y)),
        });
      });
      stage.addEventListener("pointerup", () => {
        grab = null;
      });
      const KEY_STEP = {
        ArrowLeft: [-0.04, 0],
        ArrowRight: [0.04, 0],
        ArrowUp: [0, 0.03],
        ArrowDown: [0, -0.03],
      };
      stage.addEventListener("keydown", (e) => {
        const step = KEY_STEP[e.key];
        if (!step || e.target !== stage) return;
        e.preventDefault();
        if (auto.on) setAuto(false);
        send({
          type: "target",
          x: Math.max(-0.3, Math.min(0.3, snap[1] + step[0])),
          y: Math.max(-0.2, Math.min(0.12, snap[2] + step[1])),
        });
      });
    </script>
  </head>
  <body>
    <div class="app">
      <div
        class="stage"
        id="stage"
        role="group"
        tabindex="0"
        aria-label="束"
        aria-describedby="stage-keys"
      >
        <canvas id="cv" role="img" aria-label="紐で吊った種子の殻の束"></canvas>
        <div class="title"><h1>Pod Rattle</h1></div>
        <div class="hud" id="hud" aria-hidden="true">0 hits/s</div>
        <p class="keys" id="stage-keys">←→↑↓ で振る</p>
        <button id="start" type="button">▶ 音を出す</button>
      </div>
      <aside class="rail">
        <div class="group">
          <h2>素材</h2>
          <div class="presets" id="presets">
            <button type="button" data-p="seed" aria-pressed="true">種子</button>
            <button type="button" data-p="bamboo" aria-pressed="false">竹</button>
            <button type="button" data-p="brass" aria-pressed="false">真鍮</button>
            <button type="button" data-p="steel" aria-pressed="false">鉄</button>
          </div>
          <div class="ctl">
            <label for="material">硬さ</label><output id="o-material"></output
            ><input id="material" type="range" min="0" max="1" step="0.001" />
          </div>
          <div class="ctl">
            <label for="decay">響き</label><output id="o-decay"></output
            ><input id="decay" type="range" min="0.3" max="3" step="0.01" />
          </div>
          <div class="ctl">
            <label for="pitch">音程</label><output id="o-pitch"></output
            ><input id="pitch" type="range" min="0.5" max="2" step="0.01" />
          </div>
          <div class="ctl">
            <label for="rest">反発</label><output id="o-rest"></output
            ><input id="rest" type="range" min="0.1" max="0.9" step="0.01" />
          </div>
        </div>
        <div class="group">
          <h2>倍音</h2>
          <div class="ctl">
            <label for="bright">明るさ</label><output id="o-bright"></output
            ><input id="bright" type="range" min="-0.5" max="1.2" step="0.01" />
          </div>
          <div class="ctl">
            <label for="spread">広がり</label><output id="o-spread"></output
            ><input id="spread" type="range" min="0.6" max="1.8" step="0.01" />
          </div>
          <div class="ctl">
            <label for="hiDecay">高域の響き</label><output id="o-hiDecay"></output
            ><input id="hiDecay" type="range" min="0.4" max="3" step="0.01" />
          </div>
          <div class="ctl">
            <label for="hard">当たり</label><output id="o-hard"></output
            ><input id="hard" type="range" min="0.2" max="8" step="0.01" />
          </div>
        </div>
        <div class="group">
          <h2>形</h2>
          <div class="ctl">
            <label for="count">個数</label><output id="o-count"></output
            ><input id="count" type="range" min="4" max="48" step="1" />
          </div>
          <div class="ctl">
            <label for="len">ひも</label><output id="o-len"></output
            ><input id="len" type="range" min="0.5" max="1.6" step="0.01" />
          </div>
        </div>
        <div class="group">
          <div class="row">
            <h2>振り方</h2>
            <button type="button" class="switch" id="auto" aria-pressed="true">自動で振る</button>
          </div>
          <div class="ctl">
            <label for="rate">速さ</label><output id="o-rate"></output
            ><input id="rate" type="range" min="0.5" max="7" step="0.01" />
          </div>
          <div class="ctl">
            <label for="amp">振れ幅</label><output id="o-amp"></output
            ><input id="amp" type="range" min="0.05" max="1" step="0.01" />
          </div>
        </div>
        <div class="group">
          <div class="ctl">
            <label for="gain">音量</label><output id="o-gain"></output
            ><input id="gain" type="range" min="0" max="2" step="0.01" />
          </div>
        </div>
      </aside>
    </div>
  </body>
</html>
