# Cloudflare Web Analytics のサイトトークンはビーコンとして HTML に出る公開値、Discord のユーザー ID は誰にでも見える公開値。
# f4ab1c4 の docs/skills/measure-dont-guess/SKILL.md は curl -u の例で、もう追跡していないファイルの履歴にだけある。
filter = '''
matchesAny(finding.line, [`\bCF_BEACON_TOKEN = "[0-9a-f]{32}"`, `\bOWNER_DISCORD_ID = "[0-9]{17,20}"`]) ||
(attributes["git.sha"] == "f4ab1c402143011a6264a0660f598fc02eb48bff" && attributes["path"] == "docs/skills/measure-dont-guess/SKILL.md")
'''

[extend]
useDefault = true
