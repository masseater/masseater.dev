name: verify

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions: {}

env:
  TAKUMI_GUARD_TOKEN: ${{ secrets.TAKUMI_GUARD_TOKEN }}
  VP_REMOTE_CACHE: ${{ github.event_name == 'schedule' && 'off' || 'read-write' }}

jobs:
  shard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    concurrency:
      group: verify-${{ github.ref }}-${{ matrix.shard }}
    env:
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name != 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pnpm/v12
          key: pnpm-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pnpm-metadata-
      - uses: $/.github/actions/setup
        with:
          session-path: "true"
          rust-cache: "false"
          sccache: "true"
          telemetry: "true"
      - if: github.event_name != 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/msch
          key: msch-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.shard }}
          restore-keys: msch-
      - uses: masseater/typescript-template/.github/actions/verify@0aec18eb421e6fb6160d7342470e2a24fe61069a
        timeout-minutes: 30
        with:
          github-token: ${{ github.token }}
          full-history: "true"
          shard: ${{ strategy.job-index }}
          shards: ${{ strategy.job-total }}
          share: ${{ strategy.job-index == 0 }}
      - if: always()
        uses: $/.github/actions/telemetry-files
        with:
          suffix: -${{ matrix.shard }}
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/msch
          key: msch-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.shard }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.shard }}
          path: |
            .vitest/attachments/
            apps/*/.vitest/attachments/
          if-no-files-found: ignore

  verify:
    needs: shard
    if: always() && needs.shard.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: masseater/typescript-template/.github/actions/verify-shards@0aec18eb421e6fb6160d7342470e2a24fe61069a
        with:
          result: ${{ needs.shard.result }}

  wake:
    needs: [verify, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - run: vp run -r wake-main-red

  queue:
    needs: [verify]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run update-branches.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"

  deploy:
    if: github.event_name == 'push'
    permissions:
      contents: read
      deployments: write
      id-token: write
    concurrency:
      group: deploy
    uses: $/.github/workflows/deploy.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      TAKUMI_GUARD_TOKEN: ${{ secrets.TAKUMI_GUARD_TOKEN }}

  private-names:
    needs: deploy
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: private-names
      cancel-in-progress: true
    environment: private-names
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: masseater/skills
          path: .skills-checkout
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - run: vp run -r github-token
      - run: vp run -r private-names
        env:
          CHECKOUTS: ${{ github.workspace }} ${{ github.workspace }}/.skills-checkout

  exposure:
    needs: [deploy]
    if: ${{ !cancelled() }}
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: $/.github/workflows/exposure.yml

  deploy-failure:
    needs: [deploy, private-names]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: deploy-failure
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - run: vp run -r deploy-failure
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}

  ci-telemetry:
    needs: [shard, verify, wake, deploy, private-names, exposure, deploy-failure]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@0aec18eb421e6fb6160d7342470e2a24fe61069a
        with:
          github-token: ${{ github.token }}
