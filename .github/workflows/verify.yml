name: verify

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - uses: masseater/typescript-template/.github/actions/verify@577c307ec375535021fe50e34af8bd128fbcfe66
        with:
          github-token: ${{ github.token }}
          full-history: "true"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: |
            .vitest/attachments/
            apps/*/.vitest/attachments/
          if-no-files-found: ignore

  autofix:
    needs: verify
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          FAILED_RUN_ID: ${{ github.run_id }}
        run: >-
          gh workflow run autofix.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH"
          -f run_id="$FAILED_RUN_ID" -f branch="$HEAD_BRANCH" -f sha="$HEAD_SHA"

  deploy:
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy
    uses: $/.github/workflows/deploy.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  private-names:
    needs: deploy
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: private-names
      cancel-in-progress: true
    environment: private-names
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: masseater/skills
          path: .skills-checkout
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - run: vp run -r github-token
      - run: vp run -r private-names
        env:
          CHECKOUTS: . .skills-checkout

  zenn:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: zenn
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - run: vp run -r zenn-publish
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

  sts2-pck:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: sts2-pck
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          fetch_from_github: false
          install_args: dotnet
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - run: vp run -r pck:all
        env:
          PCK_OUT: ${{ runner.temp }}/sts2-pck
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sts2-pck
          path: ${{ runner.temp }}/sts2-pck/
          if-no-files-found: ignore

  mosaic-plan:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: mosaic-plan
      cancel-in-progress: true
    permissions:
      actions: write
      contents: read
    outputs:
      rebuild: ${{ steps.plan.outputs.rebuild }}
      web: ${{ steps.plan.outputs.web }}
      slugs: ${{ steps.plan.outputs.slugs }}
      pool: ${{ steps.plan.outputs.pool }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: vp run -r mosaic-plan
      - env:
          GH_TOKEN: ${{ github.token }}
        run: vp run -r prune-caches
      - name: rebuild
        if: steps.plan.outputs.rebuild == 'true'
        run: echo "the character files are rebuilt"
      - name: web
        if: steps.plan.outputs.web == 'true'
        run: echo "the site is redeployed"

  mosaic-character:
    needs: mosaic-plan
    if: needs.mosaic-plan.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    concurrency:
      group: mosaic-character-${{ matrix.slug }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        slug: ${{ fromJSON(needs.mosaic-plan.outputs.slugs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/mosaic-character
        with:
          slug: ${{ matrix.slug }}
          pool: ${{ needs.mosaic-plan.outputs.pool }}
          job-index: ${{ strategy.job-index }}
          github-token: ${{ github.token }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  mosaic-deploy:
    needs: mosaic-plan
    if: needs.mosaic-plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: mosaic-deploy
    steps: &mosaic-site
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
          SUPERSEDING_STEPS: rebuild web
        run: vp run -r mosaic-superseded
      - name: deploy
        if: steps.head.outputs.superseded != 'true'
        run: vp run -r deploy:mosaic-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  mosaic-refresh:
    needs: [mosaic-plan, mosaic-character]
    if: always() && needs.mosaic-plan.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: mosaic-deploy
    steps: *mosaic-site

  exposure:
    needs: [deploy, zenn, sts2-pck, mosaic-plan, mosaic-character, mosaic-deploy]
    if: ${{ !cancelled() }}
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: $/.github/workflows/exposure.yml

  deploy-failure:
    needs:
      [
        deploy,
        private-names,
        zenn,
        sts2-pck,
        mosaic-plan,
        mosaic-character,
        mosaic-deploy,
        mosaic-refresh,
      ]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: deploy-failure
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - run: vp run -r deploy-failure
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}

  ci-telemetry:
    needs:
      [
        verify,
        autofix,
        deploy,
        private-names,
        zenn,
        sts2-pck,
        mosaic-plan,
        mosaic-character,
        mosaic-deploy,
        mosaic-refresh,
        exposure,
        deploy-failure,
      ]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@577c307ec375535021fe50e34af8bd128fbcfe66
        with:
          github-token: ${{ github.token }}
