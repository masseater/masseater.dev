name: verify

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions: {}

env:
  TAKUMI_GUARD_TOKEN: ${{ secrets.TAKUMI_GUARD_TOKEN }}
  VP_REMOTE_CACHE: ${{ github.event_name == 'schedule' && 'off' || 'read-write' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name != 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pnpm/v12
          key: pnpm-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pnpm-metadata-
      - uses: $/.github/actions/setup
        with:
          session-path: "true"
          rust-cache: "false"
          sccache: "true"
      - if: github.event_name != 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/msch
          key: msch-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: msch-
      - uses: masseater/typescript-template/.github/actions/verify@5fbdf9423d0e5debb5d59bc6d59bfec624343aff
        with:
          github-token: ${{ github.token }}
          full-history: "true"
          share: "false"
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/msch
          key: msch-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: |
            .vitest/attachments/
            apps/*/.vitest/attachments/
          if-no-files-found: ignore

  cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: cache-${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pnpm/v12
          key: pnpm-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pnpm-metadata-
      - id: pnpm-metadata-before
        run: echo "files=$(find ~/.cache/pnpm/v12 -type f 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
      - uses: $/.github/actions/setup
        with:
          session-path: "true"
          rust-cache: "false"
          sccache: "true"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/msch
          key: msch-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: msch-
      - uses: masseater/typescript-template/.github/actions/verify@5fbdf9423d0e5debb5d59bc6d59bfec624343aff
        with:
          github-token: ${{ github.token }}
          full-history: "true"
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/msch
          key: msch-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - id: pnpm-metadata-after
        if: always()
        run: echo "files=$(find ~/.cache/pnpm/v12 -type f 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
      - if: always() && steps.pnpm-metadata-after.outputs.files != steps.pnpm-metadata-before.outputs.files
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pnpm/v12
          key: pnpm-metadata-${{ github.run_id }}-${{ github.run_attempt }}

  autofix:
    needs: verify
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          FAILED_RUN_ID: ${{ github.run_id }}
        run: >-
          gh workflow run autofix.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH"
          -f run_id="$FAILED_RUN_ID" -f branch="$HEAD_BRANCH" -f sha="$HEAD_SHA"

  deploy:
    if: github.event_name == 'push'
    permissions:
      contents: read
      deployments: write
      id-token: write
    concurrency:
      group: deploy
    uses: $/.github/workflows/deploy.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      TAKUMI_GUARD_TOKEN: ${{ secrets.TAKUMI_GUARD_TOKEN }}

  private-names:
    needs: deploy
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: private-names
      cancel-in-progress: true
    environment: private-names
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: masseater/skills
          path: .skills-checkout
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - run: vp run -r github-token
      - run: vp run -r private-names
        env:
          CHECKOUTS: ${{ github.workspace }} ${{ github.workspace }}/.skills-checkout

  exposure:
    needs: [deploy]
    if: ${{ !cancelled() }}
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: $/.github/workflows/exposure.yml

  deploy-failure:
    needs: [deploy, private-names]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: deploy-failure
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - run: vp run -r deploy-failure
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}

  ci-telemetry:
    needs: [verify, cache, autofix, deploy, private-names, exposure, deploy-failure]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@5fbdf9423d0e5debb5d59bc6d59bfec624343aff
        with:
          github-token: ${{ github.token }}
