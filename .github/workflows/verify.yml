name: verify

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git fetch --unshallow --filter=blob:none origin
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          gh auth setup-git
          commits="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE_SHA...$HEAD_SHA" --jq .total_commits)"
          git fetch --no-tags --depth="$((commits + 1))" origin "$HEAD_SHA"
          vp exec commitlint --from "$BEFORE_SHA" --to "$HEAD_SHA" --verbose
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/oxlint-plugin-decision
          key: oxlint-plugin-decision-${{ github.sha }}
          restore-keys: oxlint-plugin-decision-
      - id: verify
        run: vp run --log grouped verify
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - if: always() && steps.verify.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/oxlint-plugin-decision
          key: oxlint-plugin-decision-${{ github.sha }}

  autofix:
    needs: verify
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          FAILED_RUN_ID: ${{ github.run_id }}
        run: >-
          gh workflow run autofix.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH"
          -f run_id="$FAILED_RUN_ID" -f branch="$HEAD_BRANCH" -f sha="$HEAD_SHA"

  deploy:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy
    outputs:
      latest: ${{ steps.head.outputs.latest }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF_NAME" --jq .sha)"
          if [ "$current" = "$HEAD_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.head.outputs.latest == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.head.outputs.latest == 'true'
        run: git fetch --unshallow --filter=blob:none origin
      - if: steps.head.outputs.latest == 'true'
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - if: steps.head.outputs.latest == 'true'
        run: vp exec --filter portfolio alchemy deploy --yes
        env:
          ALCHEMY_STAGE: prod
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  github:
    needs: deploy
    if: needs.deploy.outputs.latest == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: github
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: token
        run: .github/scripts/github-token.sh
      - if: steps.token.outputs.issued == 'true'
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - if: steps.token.outputs.issued == 'true'
        run: vp run --filter portfolio deploy:github
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  zenn:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: zenn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          gh auth setup-git
          tree="$(git rev-parse HEAD:apps/zenn-articles)"
          parent=()
          if git fetch --no-tags --depth=1 origin zenn; then
            if [ "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$tree" ]; then
              exit 0
            fi
            parent=(-p FETCH_HEAD)
          fi
          commit="$(git commit-tree "$tree" "${parent[@]}" -m "deploy: $GITHUB_SHA")"
          git push origin "$commit:refs/heads/zenn"

  mosaic-plan:
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.slugs.outputs.latest }}
      slugs: ${{ steps.slugs.outputs.slugs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/latest-commit.sh
            libs/mosaic/src/characters.json
          sparse-checkout-cone-mode: false
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: .github/scripts/latest-commit.sh
      - id: touched
        if: steps.head.outputs.latest == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE_SHA...$HEAD_SHA" --jq '.files[].filename' \
            | grep -E '^((apps|libs|tools)/mosaic/|pnpm-lock\.yaml$|\.github/workflows/verify\.yml$)'; then
            echo "mosaic=true" >> "$GITHUB_OUTPUT"
          fi
      - id: slugs
        if: steps.head.outputs.latest == 'true' && (github.event_name == 'schedule' || steps.touched.outputs.mosaic == 'true')
        run: |
          echo "latest=true" >> "$GITHUB_OUTPUT"
          echo "slugs=$(jq -c '[.[].slug]' libs/mosaic/src/characters.json)" >> "$GITHUB_OUTPUT"

  mosaic-character:
    needs: mosaic-plan
    if: needs.mosaic-plan.outputs.latest == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: mosaic-character-${{ matrix.slug }}
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.mosaic-plan.outputs.slugs) }}
    env:
      SLUG: ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: start
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: .github/scripts/latest-commit.sh
      - if: steps.start.outputs.latest == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - id: pool
        if: steps.start.outputs.latest == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/mosaic/.cache/pool.tar
          key: mosaic-pool-${{ matrix.slug }}-${{ github.run_id }}
          restore-keys: |
            mosaic-pool-${{ matrix.slug }}-
      - if: steps.start.outputs.latest == 'true' && steps.pool.outputs.cache-matched-key != ''
        run: |
          if tar -tf pool.tar -- "$SLUG" > /dev/null; then
            tar -xf pool.tar -- "$SLUG"
          fi
          rm pool.tar
        working-directory: tools/mosaic/.cache
      - if: steps.start.outputs.latest == 'true'
        run: sleep "$((JOB_INDEX * 30))"
        env:
          JOB_INDEX: ${{ strategy.job-index }}
      - if: steps.start.outputs.latest == 'true'
        run: uv run mosaic songs "$SLUG"
        timeout-minutes: 30
        continue-on-error: true
        working-directory: tools/mosaic
      - id: build-pool
        if: steps.start.outputs.latest == 'true'
        run: uv run mosaic pool "$SLUG"
        working-directory: tools/mosaic
      - if: steps.start.outputs.latest == 'true'
        run: uv run mosaic solve "$SLUG"
        working-directory: tools/mosaic
      - if: steps.start.outputs.latest == 'true'
        run: uv run mosaic site "$SLUG"
        working-directory: tools/mosaic
      - if: always() && steps.build-pool.outcome != 'skipped'
        run: |
          files=()
          for file in small target.png vocadb/songs.json thumbs.npz niconico-og.json; do
            if [ -e "$SLUG/$file" ]; then
              files+=("$SLUG/$file")
            fi
          done
          tar -cf pool.tar -- "${files[@]}"
        working-directory: tools/mosaic/.cache
      - if: always() && steps.build-pool.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/mosaic/.cache/pool.tar
          key: mosaic-pool-${{ matrix.slug }}-${{ hashFiles(format('tools/mosaic/.cache/{0}/vocadb/songs.json', matrix.slug), format('tools/mosaic/.cache/{0}/thumbs.npz', matrix.slug), format('tools/mosaic/.cache/{0}/niconico-og.json', matrix.slug)) }}
      - id: changed
        if: steps.start.outputs.latest == 'true'
        run: |
          rm -rf tools/mosaic/.cache
          if [ -d "apps/mosaic/public/files/$SLUG/0" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.changed == 'true'
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - id: still
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: .github/scripts/latest-commit.sh
      - if: steps.still.outputs.latest == 'true'
        run: vp exec alchemy deploy alchemy.files.ts --stage "$SLUG" --yes
        working-directory: apps/mosaic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.start.outputs.latest == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/live/$SLUG"
          cp "apps/mosaic/public/files/$SLUG/manifest.json" "apps/mosaic/public/files/$SLUG/candidates.json" "$RUNNER_TEMP/live/$SLUG/"
      - if: steps.start.outputs.latest == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mosaic-live-${{ matrix.slug }}
          path: ${{ runner.temp }}/live/
          if-no-files-found: error
          retention-days: 1

  mosaic-deploy:
    needs: [mosaic-plan, mosaic-character]
    if: always() && needs.mosaic-plan.outputs.latest == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: mosaic-deploy
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF_NAME" --jq .sha)"
          if [ "$current" = "$HEAD_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.head.outputs.latest == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.head.outputs.latest == 'true'
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - if: steps.head.outputs.latest == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mosaic-live-*
          path: apps/mosaic/public/files
          merge-multiple: true
      - if: steps.head.outputs.latest == 'true'
        run: vp exec alchemy deploy --stage production --yes
        working-directory: apps/mosaic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  release:
    needs: verify
    if: github.repository == 'masseater/typescript-template'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json
          skip-github-pull-request: true
      - if: github.event_name == 'workflow_dispatch'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json
          skip-github-release: true

  ci-telemetry:
    needs:
      [verify, autofix, deploy, github, zenn, mosaic-plan, mosaic-character, mosaic-deploy, release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ci-telemetry.sh
            apps/portfolio/app-name.ts
          sparse-checkout-cone-mode: false
      - run: .github/scripts/ci-telemetry.sh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
