name: release-component

on:
  workflow_call:
    inputs:
      component:
        description: One entry of the components that the release-components task prints
        required: true
        type: string

permissions: {}

env:
  CARGO_TERM_COLOR: always
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

jobs:
  tag:
    if: github.ref == 'refs/heads/main' && fromJSON(inputs.component).publish && fromJSON(inputs.component).build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - name: Tag the revision before main changes a workflow file
        run: vp run --filter "./$DIRECTORY" release:tag
        env:
          DIRECTORY: ${{ fromJSON(inputs.component).directory }}
          GH_TOKEN: ${{ github.token }}

  build:
    if: fromJSON(inputs.component).build
    name: build (${{ matrix.platform.os }})
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.component).builds }}
    runs-on: ${{ matrix.platform.runner }}
    environment: ${{ fromJSON(inputs.component).environment }}
    concurrency:
      group: release-build-${{ fromJSON(inputs.component).name }}-${{ matrix.platform.os }}
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        uses: $/.github/actions/linux-packages
        with:
          extra: xvfb
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          fetch_from_github: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ fromJSON(inputs.component).name }}-${{ matrix.platform.os }}
          workspaces: |
            .
            tools/cargo-tools
      - run: vp run --filter "./$DIRECTORY" "release:$OS"
        env:
          DIRECTORY: ${{ fromJSON(inputs.component).directory }}
          OS: ${{ matrix.platform.os }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports@${{ fromJSON(inputs.component).name }}@${{ matrix.platform.os }}
          path: ${{ fromJSON(inputs.component).directory }}/release-reports
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release@${{ fromJSON(inputs.component).name }}@${{ matrix.platform.os }}
          path: ${{ fromJSON(inputs.component).directory }}/release-assets
          if-no-files-found: error
          compression-level: 0

  check:
    needs: build
    if: fromJSON(inputs.component).build && fromJSON(inputs.component).checks[0] != null
    name: check (${{ matrix.platform.os }})
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.component).checks }}
    runs-on: ${{ matrix.platform.runner }}
    concurrency:
      group: release-check-${{ fromJSON(inputs.component).name }}-${{ matrix.platform.os }}
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release@${{ fromJSON(inputs.component).name }}@${{ matrix.platform.os }}
          path: ${{ fromJSON(inputs.component).directory }}/release-assets
      - run: vp run --filter "./$DIRECTORY" "release:check:$OS"
        env:
          DIRECTORY: ${{ fromJSON(inputs.component).directory }}
          OS: ${{ matrix.platform.os }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports@${{ fromJSON(inputs.component).name }}@${{ matrix.platform.os }}@check
          path: ${{ fromJSON(inputs.component).directory }}/release-reports
          if-no-files-found: ignore

  publish:
    needs: [tag, build, check]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && fromJSON(inputs.component).publish
      && needs.tag.result == 'success' && needs.build.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.check.result)
    runs-on: ubuntu-latest
    environment: ${{ fromJSON(inputs.component).environment }}
    concurrency:
      group: release-publish-${{ fromJSON(inputs.component).name }}
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release@${{ fromJSON(inputs.component).name }}@*
          path: ${{ fromJSON(inputs.component).directory }}/release-assets
          merge-multiple: true
      - name: Publish the release with its assets unless it has them
        run: vp run --filter "./$DIRECTORY" release:publish
        env:
          DIRECTORY: ${{ fromJSON(inputs.component).directory }}
          GH_TOKEN: ${{ github.token }}

  please:
    needs: publish
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && fromJSON(inputs.component).publish
      && (needs.publish.result == 'success' || !fromJSON(inputs.component).build)
    runs-on: ubuntu-latest
    environment: ${{ fromJSON(inputs.component).environment }}
    concurrency:
      group: release-please-${{ fromJSON(inputs.component).name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - id: app-token
        run: vp run --filter "./$DIRECTORY" release:token
        env:
          DIRECTORY: ${{ fromJSON(inputs.component).directory }}
          GH_TOKEN: ${{ github.token }}
      - if: steps.app-token.outputs.token != ''
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: ${{ fromJSON(inputs.component).directory }}/release-please-config.json
          manifest-file: ${{ fromJSON(inputs.component).directory }}/.release-please-manifest.json
          skip-github-release: true

  mark:
    needs: [tag, build, check, publish, please]
    if: >-
      !cancelled()
      && contains(fromJSON('["success", "skipped"]'), needs.tag.result)
      && contains(fromJSON('["success", "skipped"]'), needs.build.result)
      && contains(fromJSON('["success", "skipped"]'), needs.check.result)
      && contains(fromJSON('["success", "skipped"]'), needs.publish.result)
      && contains(fromJSON('["success", "skipped"]'), needs.please.result)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - run: vp run -r record-deployment
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ENVIRONMENT: release
          DEPLOYMENT_TASK: release:${{ fromJSON(inputs.component).name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
