name: deploy

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      NPM_TOKEN:
        required: true
      TAKUMI_GUARD_TOKEN:
        required: false

permissions: {}

env:
  TAKUMI_GUARD_TOKEN: ${{ secrets.TAKUMI_GUARD_TOKEN }}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      bootstrap: ${{ steps.stacks.outputs.bootstrap }}
      tailnet: ${{ steps.stacks.outputs.tailnet }}
      broker: ${{ steps.stacks.outputs.broker }}
      zone: ${{ steps.stacks.outputs.zone }}
      stacks: ${{ steps.stacks.outputs.stacks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git fetch --unshallow --filter=blob:none origin
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - id: stacks
        run: vp run -r deploy-stacks
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}

  bootstrap:
    needs: plan
    if: ${{ needs.plan.outputs.bootstrap != '[]' }}
    runs-on: ubuntu-latest
    environment: bootstrap
    permissions:
      contents: read
      deployments: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - run: vp run -r atproto-password
        continue-on-error: true
      - if: env.ATP_APP_PASSWORD != ''
        run: vp run -r standard-site
        continue-on-error: true
        env:
          ATP_IDENTIFIER: did:plc:sz2kxumpsjbch3kgnsjjed5z
      - run: vp run -r deploy:bootstrap
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: vp run -r record-stage
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: deploy:bootstrap
          STACKS: ${{ needs.plan.outputs.bootstrap }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}

  tailnet:
    needs: plan
    if: ${{ needs.plan.outputs.tailnet != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - run: vp run -r deploy:tailnet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: vp run -r record-stage
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: deploy:tailnet
          STACKS: ${{ needs.plan.outputs.tailnet }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}

  broker:
    needs: [plan, bootstrap, tailnet]
    if: ${{ !cancelled() && needs.plan.outputs.broker != '[]' }}
    runs-on: ubuntu-latest
    environment: bootstrap
    permissions:
      contents: read
      deployments: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - run: vp run -r deploy:broker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: vp run -r record-stage
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: deploy:broker
          STACKS: ${{ needs.plan.outputs.broker }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}

  production:
    needs: [plan, bootstrap, broker]
    if: ${{ !cancelled() && needs.plan.outputs.stacks != '' && needs.plan.outputs.stacks != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      deployments: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: masseater/typescript-template/.github/actions/credentials@01e4330d6c9790af645c67973712c47971137da4
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - run: vp run -r deploy-production
        env:
          GH_TOKEN: ${{ github.token }}
          STACKS: ${{ needs.plan.outputs.stacks }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-measurements
          path: apps/*/report/
          if-no-files-found: ignore

  zone:
    needs: [plan, broker]
    if: ${{ !cancelled() && needs.plan.outputs.zone != '[]' }}
    runs-on: ubuntu-latest
    environment: zone
    permissions:
      contents: read
      deployments: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: masseater/typescript-template/.github/actions/credentials@01e4330d6c9790af645c67973712c47971137da4
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - run: vp run -r deploy:zone
      - run: vp run -r record-stage
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: deploy:zone
          STACKS: ${{ needs.plan.outputs.zone }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}

  github:
    needs: broker
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment: github
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - run: vp run -r github-token
      - run: vp run -r deploy:github
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
