name: web-analytics

on:
  workflow_dispatch:
    inputs:
      path:
        description: 日別・参照元・国を絞るパス（例 /satsuei-lab/）。空なら全体
        required: false
        default: ""
      days:
        description: さかのぼる日数
        required: false
        default: "7"

permissions: {}

concurrency:
  group: web-analytics

jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/web-analytics.sh
            apps/portfolio/alchemy.run.ts
          sparse-checkout-cone-mode: false
      - run: .github/scripts/web-analytics.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPORT_PATH: ${{ inputs.path }}
          REPORT_DAYS: ${{ inputs.days }}

  ci-telemetry:
    needs: [report]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ci-telemetry.sh
            apps/portfolio/app-name.ts
          sparse-checkout-cone-mode: false
      - run: .github/scripts/ci-telemetry.sh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
