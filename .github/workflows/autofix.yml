name: autofix

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The verify run that failed
        required: true
        type: string
      branch:
        description: The branch the failed run verified
        required: true
        type: string
      sha:
        description: The commit the failed run verified
        required: true
        type: string

permissions: {}

jobs:
  autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
      id-token: write
    concurrency:
      group: verify-autofix-${{ inputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false
      - uses: $/.github/actions/setup
      - uses: masseater/typescript-template/.github/actions/autofix@cce4776b33a65c27d2a238b72115bdb31a172c30
        with:
          run-id: ${{ inputs.run_id }}
          branch: ${{ inputs.branch }}
          sha: ${{ inputs.sha }}
          github-token: ${{ github.token }}

  ci-telemetry:
    needs: [autofix]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@cce4776b33a65c27d2a238b72115bdb31a172c30
        with:
          github-token: ${{ github.token }}
