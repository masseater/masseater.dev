name: autofix

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The verify run that failed
        required: true
        type: string
      sha:
        description: The commit the failed run verified
        required: true
        type: string

permissions: {}

env:
  TAKUMI_GUARD_TOKEN: ${{ secrets.TAKUMI_GUARD_TOKEN }}

jobs:
  autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
      id-token: write
    concurrency:
      group: verify-autofix-${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - uses: masseater/typescript-template/.github/actions/autofix@b1a8d96e78c5009696da80b5ecf5a814551966b8
        with:
          run-id: ${{ inputs.run_id }}
          branch: ${{ github.ref_name }}
          sha: ${{ inputs.sha }}
          github-token: ${{ github.token }}

  ci-telemetry:
    needs: [autofix]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@b1a8d96e78c5009696da80b5ecf5a814551966b8
        with:
          github-token: ${{ github.token }}
