name: delete-secrets

on:
  workflow_dispatch:
    inputs:
      repositories:
        description: secret を消すリポの名前（カンマ区切り）
        required: true
      secrets:
        description: 消す secret の名前（カンマ区切り）
        required: true

permissions: {}

concurrency:
  group: github

jobs:
  delete:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: token
        run: .github/scripts/github-token.sh
      - if: steps.token.outputs.issued != 'true'
        run: exit 1
      - run: .github/scripts/delete-secrets.sh

  ci-telemetry:
    needs: [delete]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@b3f71994bfe791783b8cb290f532f1494bac58bc
        with:
          github-token: ${{ github.token }}
