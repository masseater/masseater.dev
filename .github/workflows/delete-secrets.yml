name: delete-secrets

on:
  workflow_dispatch:
    inputs:
      repositories:
        description: secret を消すリポの名前（カンマ区切り）
        required: true
      secrets:
        description: 消す secret の名前（カンマ区切り）
        required: true

permissions: {}

concurrency:
  group: github

jobs:
  delete:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: token
        run: .github/scripts/github-token.sh
      - if: steps.token.outputs.issued != 'true'
        run: exit 1
      - run: .github/scripts/delete-secrets.sh

  ci-telemetry:
    needs: [delete]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/portfolio/app-name.ts
          sparse-checkout-cone-mode: false
      - run: .github/scripts/ci-telemetry.sh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
