name: pod-rattle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  PLUGINVAL_VERSION: v1.0.4
  CLAP_VALIDATOR_VERSION: 0.4.1

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            bundle: bundle-all
          - os: windows-latest
            platform: windows-x86_64
            bundle: bundle-all
          - os: macos-latest
            platform: macos-universal
            bundle: bundle-universal-all
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && xargs -a .github/actions/setup/linux-packages.txt sudo apt-get install -y xvfb
      - run: rustup toolchain install
      - if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.platform }}
      - run: cargo xtask ${{ matrix.bundle }} --release
      - if: runner.os == 'macOS'
        working-directory: target/bundled
        run: |
          for bundle in *.vst3 *.clap; do codesign --force --deep --sign - "$bundle"; done
      - name: pluginval (VST3)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) asset=pluginval_Linux.zip; run=(xvfb-run -a ./pluginval) ;;
            Windows) asset=pluginval_Windows.zip; run=(./pluginval.exe) ;;
            macOS) asset=pluginval_macOS.zip; run=(./pluginval.app/Contents/MacOS/pluginval) ;;
          esac
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/$asset"
          unzip -q pluginval.zip
          for bundle in target/bundled/*.vst3; do
            "${run[@]}" --strictness-level 10 --skip-gui-tests --validate-in-process --timeout-ms 300000 --output-dir pluginval-report "$bundle"
          done
      - name: clap-validator
        if: runner.os != 'Windows'
        run: |
          cargo install --locked --git https://github.com/free-audio/clap-validator --tag "$CLAP_VALIDATOR_VERSION" clap-validator
          for bundle in target/bundled/*.clap; do clap-validator validate "$bundle"; done
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pluginval-${{ matrix.platform }}
          path: pluginval-report
          if-no-files-found: ignore
      - name: Archive
        shell: bash
        working-directory: target/bundled
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p ../../dist
          for vst3 in *.vst3; do
            name="${vst3%.vst3}"
            slug="$(tr '[:upper:] ' '[:lower:]-' <<<"$name")"
            7z a -tzip "../../dist/$slug-$PLATFORM.zip" "$name.vst3" "$name.clap"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugins-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: bundle
    runs-on: ubuntu-latest
    environment: pod-rattle-release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    concurrency:
      group: pod-rattle-release
    steps:
      - id: tagged
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please/pod-rattle-config.json
          manifest-file: .github/release-please/pod-rattle-manifest.json
          skip-github-pull-request: true
      - if: steps.tagged.outputs.releases_created != 'true'
        id: app-token
        run: |
          oidc="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=masseater-dev-credential-broker" | jq -er .value)"
          echo "::add-mask::$oidc"
          token="$(curl -fsS --retry 3 -X POST -H "Authorization: Bearer $oidc" \
            "https://credentials.masseater.dev/" | jq -er '.githubToken // empty')"
          if [ -n "$token" ]; then
            echo "::add-mask::$token"
            echo "token=$token" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.app-token.outputs.token != ''
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please/pod-rattle-config.json
          manifest-file: .github/release-please/pod-rattle-manifest.json
          skip-github-release: true
      - if: steps.tagged.outputs.releases_created == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugins-*
          merge-multiple: true
      - if: steps.tagged.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUTS: ${{ toJSON(steps.tagged.outputs) }}
        run: |
          jq -r '.paths_released | fromjson | .[]' <<<"$OUTPUTS" | while read -r path; do
            tag="$(jq -er --arg key "$path--tag_name" '.[$key]' <<<"$OUTPUTS")"
            gh release upload "$tag" "${tag%-v*}"-*.zip --repo "$GITHUB_REPOSITORY" --clobber
          done

  ci-telemetry:
    needs: [bundle, release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@9fd918dd489a841010b0a5fb6e4ed9d1f8a11ec1
        with:
          github-token: ${{ github.token }}
