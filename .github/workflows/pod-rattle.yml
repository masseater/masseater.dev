name: pod-rattle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  PLUGINVAL_VERSION: v1.0.4
  PLUGINVAL_SHA256_LINUX: c01c49d8063965c4c2dea8324468336768f5c9139e0b1caebde14c2400b55352
  PLUGINVAL_SHA256_WINDOWS: c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab
  PLUGINVAL_SHA256_MACOS: 3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f
  CLAP_VALIDATOR_VERSION: 0.4.1

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            bundle: bundle-all
          - os: windows-latest
            platform: windows-x86_64
            bundle: bundle-all
          - os: macos-latest
            platform: macos-universal
            bundle: bundle-universal-all
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && xargs -a .github/actions/setup/linux-packages.txt sudo apt-get install -y xvfb
      - run: rustup toolchain install
      - if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.platform }}
      - run: cargo run --package xtask --release -- ${{ matrix.bundle }} --release
      - if: runner.os == 'macOS'
        working-directory: target/bundled
        run: |
          for bundle in *.vst3 *.clap; do codesign --force --deep --sign - "$bundle"; done
      - name: pluginval (VST3)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) asset=pluginval_Linux.zip; sha256="$PLUGINVAL_SHA256_LINUX"; run=(xvfb-run -a ./pluginval) ;;
            Windows) asset=pluginval_Windows.zip; sha256="$PLUGINVAL_SHA256_WINDOWS"; run=(./pluginval.exe) ;;
            macOS) asset=pluginval_macOS.zip; sha256="$PLUGINVAL_SHA256_MACOS"; run=(./pluginval.app/Contents/MacOS/pluginval) ;;
          esac
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/$asset"
          if command -v sha256sum >/dev/null; then
            echo "$sha256  pluginval.zip" | sha256sum --check --quiet -
          else
            echo "$sha256  pluginval.zip" | shasum --algorithm 256 --check --quiet -
          fi
          unzip -q pluginval.zip
          for bundle in target/bundled/*.vst3; do
            "${run[@]}" --strictness-level 10 --validate-in-process --timeout-ms 300000 --output-dir pluginval-report "$bundle"
          done
      - name: Render MIDI in a VST3 host
        shell: bash
        run: |
          for bundle in target/bundled/*.vst3; do
            cargo run --package pod-rattle-host --release -- "$bundle" host-report
          done
      - name: clap-validator
        if: runner.os != 'Windows'
        run: |
          cargo install --locked --git https://github.com/free-audio/clap-validator --tag "$CLAP_VALIDATOR_VERSION" clap-validator
          for bundle in target/bundled/*.clap; do clap-validator validate "$bundle"; done
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pluginval-${{ matrix.platform }}
          path: |
            pluginval-report
            host-report
          if-no-files-found: ignore
      - name: Archive
        shell: bash
        working-directory: target/bundled
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p ../../dist
          for vst3 in *.vst3; do
            name="${vst3%.vst3}"
            slug="$(tr '[:upper:] ' '[:lower:]-' <<<"$name")"
            7z a -tzip "../../dist/$slug-$PLATFORM.zip" "$name.vst3" "$name.clap"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugins-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: bundle
    runs-on: ubuntu-latest
    environment: pod-rattle-release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    concurrency:
      group: pod-rattle-release
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GITHUB_REPOSITORY/contents/.github/release-please/pod-rattle-manifest.json?ref=$GITHUB_SHA" |
            jq -er '."apps/pod-rattle-plugin"')"
          tag="pod-rattle-v$version"
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --title "pod-rattle: v$version" --generate-notes
          fi
          gh pr list --repo "$GITHUB_REPOSITORY" --state merged --label "autorelease: pending" \
            --head release-please--branches--main--components--pod-rattle --json number --jq '.[].number' |
            while read -r pr; do
              gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" \
                --remove-label "autorelease: pending" --add-label "autorelease: tagged"
            done
          assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          if [ "$assets" -eq 0 ]; then
            echo "tag=$tag" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.release.outputs.tag != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugins-*
          merge-multiple: true
      - if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$TAG" pod-rattle-*.zip --repo "$GITHUB_REPOSITORY" --clobber
      - id: app-token
        run: |
          oidc="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=masseater-dev-credential-broker" | jq -er .value)"
          echo "::add-mask::$oidc"
          token="$(curl -fsS --retry 3 -X POST -H "Authorization: Bearer $oidc" \
            "https://credentials.masseater.dev/" | jq -er '.githubToken // empty')"
          if [ -n "$token" ]; then
            echo "::add-mask::$token"
            echo "token=$token" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.app-token.outputs.token != ''
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please/pod-rattle-config.json
          manifest-file: .github/release-please/pod-rattle-manifest.json
          skip-github-release: true

  ci-telemetry:
    needs: [bundle, release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@cce4776b33a65c27d2a238b72115bdb31a172c30
        with:
          github-token: ${{ github.token }}
