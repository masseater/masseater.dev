name: pod-rattle

on:
  push:
    branches: [main]
    paths:
      - "apps/pod-rattle-plugin/**"
      - "libs/pod-rattle-engine/**"
      - "tools/pod-rattle-host/**"
      - "tools/xtask/**"
      - "libs/component-release/**"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "!**/*.md"
      - ".github/actions/linux-packages/**"
      - ".github/release-please/pod-rattle-*.json"
      - ".github/workflows/pod-rattle.yml"
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - name: Tag the revision before main changes a workflow file
        env:
          GH_TOKEN: ${{ github.token }}
        run: vp run release:tag
        working-directory: apps/pod-rattle-plugin

  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-latest
            platform: macos-universal
    runs-on: ${{ matrix.os }}
    concurrency:
      group: pod-rattle-bundle-${{ matrix.platform }}
      cancel-in-progress: true
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/pod-rattle-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        uses: $/.github/actions/linux-packages
        with:
          extra: xvfb
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - run: rustup toolchain install
      - if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.platform }}
      - run: vp run ci:bundle
      - if: runner.os == 'macOS'
        run: vp run ci:codesign
      - name: pluginval (VST3)
        run: vp run ci:pluginval
      - name: Render MIDI in a VST3 host
        run: vp run ci:host
      - name: clap-validator
        if: runner.os != 'Windows'
        run: vp run ci:clap-validator
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pluginval-${{ matrix.platform }}
          path: |
            apps/pod-rattle-plugin/pluginval-report
            apps/pod-rattle-plugin/host-report
          if-no-files-found: ignore
      - name: Archive
        env:
          PLATFORM: ${{ matrix.platform }}
        run: vp run ci:archive
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugins-${{ matrix.platform }}
          path: apps/pod-rattle-plugin/plugins/*.zip
          if-no-files-found: error

  release:
    needs: [tag, bundle]
    runs-on: ubuntu-latest
    environment: pod-rattle-release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    concurrency:
      group: pod-rattle-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugins-*
          path: apps/pod-rattle-plugin/plugins
          merge-multiple: true
      - name: Publish the release with the plugins unless it has them
        env:
          GH_TOKEN: ${{ github.token }}
        run: vp run release:publish
        working-directory: apps/pod-rattle-plugin
      - id: app-token
        env:
          GH_TOKEN: ${{ github.token }}
        run: vp run release:token
        working-directory: apps/pod-rattle-plugin
      - if: steps.app-token.outputs.token != ''
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please/pod-rattle-config.json
          manifest-file: .github/release-please/pod-rattle-manifest.json
          skip-github-release: true

  ci-telemetry:
    needs: [tag, bundle, release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@988d10d667dd956eb17a81ec39e8b8cbba5c898a
        with:
          github-token: ${{ github.token }}
