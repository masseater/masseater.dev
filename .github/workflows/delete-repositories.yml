name: delete-repositories

on:
  workflow_dispatch:
    inputs:
      repositories:
        description: 消すリポの名前（カンマ区切り）
        required: true

permissions: {}

concurrency:
  group: github

jobs:
  delete:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: token
        run: .github/scripts/github-token.sh
      - if: steps.token.outputs.issued != 'true'
        run: exit 1
      - run: .github/scripts/delete-repositories.sh

  ci-telemetry:
    needs: [delete]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@0c9f2c316a486637e22878aea5e0a4a1a7f630c4
        with:
          github-token: ${{ github.token }}
