name: delete-repositories

on:
  workflow_dispatch:
    inputs:
      repositories:
        description: 消すリポの名前（カンマ区切り）
        required: true

permissions: {}

concurrency:
  group: github

jobs:
  delete:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - run: .github/scripts/github-token.sh
      - run: .github/scripts/delete-repositories.sh

  ci-telemetry:
    needs: [delete]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@e46581978887d3b9287deed1225e649234aee2a5
        with:
          github-token: ${{ github.token }}
