name: mcp-portal-status

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: mcp-portal-status

jobs:
  status:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: mcp-portal
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: masseater/typescript-template/.github/actions/credentials@a76b6452b4c008062dc453dc5f116557b8056978
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - name: Sync each server and print the portals and Access applications
        run: node status.ts
        working-directory: infra/mcp-portal

  ci-telemetry:
    needs: [status]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@a76b6452b4c008062dc453dc5f116557b8056978
        with:
          github-token: ${{ github.token }}
