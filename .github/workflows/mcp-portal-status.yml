name: mcp-portal-status

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: mcp-portal-status

jobs:
  status:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: mcp-portal
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: masseater/typescript-template/.github/actions/credentials@b77702f6b236f8c55096abed4aa408458d15d3c3
      - name: Sync each server and print its state
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/ai-controls/mcp/servers"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          for id in $(curl -fsS -H "$auth" "$api?per_page=100" | jq -r '.result[].id'); do
            echo "== $id"
            curl -sS -X POST -H "$auth" "$api/$id/sync" | jq -c .
          done
      - name: Print portals and Access applications
        run: |
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -sS -H "$auth" "$base/ai-controls/mcp/portals?per_page=100" |
            jq -c '.errors, (.result[]? | {id, hostname, code_mode, allow_code_mode, servers})'
          curl -sS -H "$auth" "$base/apps?per_page=100" |
            jq -c '.errors, (.result[]? | {name, type, domain, aud, destinations, oauth: .oauth_configuration})'

  ci-telemetry:
    needs: [status]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@b77702f6b236f8c55096abed4aa408458d15d3c3
        with:
          github-token: ${{ github.token }}
