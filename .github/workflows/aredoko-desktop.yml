name: aredoko-desktop

on:
  push:
    tags: ["aredoko-v*"]
  workflow_dispatch:

permissions: {}

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - name: Build the installer
        run: vp run installer
        working-directory: apps/aredoko-desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aredoko-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$env:TAG" (Get-Item target/release/bundle/nsis/*.exe) --clobber --repo "$env:GITHUB_REPOSITORY"

  ci-telemetry:
    needs: [installer]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@d931a8843e20a6675286de4aae013da4778a72d6
        with:
          github-token: ${{ github.token }}
