name: nimado

on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nimado
  queue: max

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      actions: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .nimado-state/youtube.json
            .nimado-state/data/days/youtube
          key: nimado-youtube-${{ github.run_id }}
          restore-keys: |
            nimado-youtube-
      - name: collect and publish
        run: vp run daily
        working-directory: tools/nimado-collect
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - uses: masseater/typescript-template/.github/actions/credentials@93ede91739120dbe2102f1a4a5dbcfcb67641f36
      - name: deploy data and drop old data versions
        run: vp run release
        working-directory: tools/nimado-collect
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() }}
        with:
          path: |
            .nimado-state/youtube.json
            .nimado-state/data/days/youtube
          key: nimado-youtube-${{ github.run_id }}
      - name: save state
        if: ${{ !cancelled() }}
        run: vp run save
        working-directory: tools/nimado-collect
        env:
          GH_TOKEN: ${{ github.token }}

  ci-telemetry:
    needs: [collect]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@93ede91739120dbe2102f1a4a5dbcfcb67641f36
        with:
          github-token: ${{ github.token }}
