name: workers-builds-logs

on:
  workflow_dispatch:
    inputs:
      worker:
        description: ビルドのログを読む Worker のスクリプト名
        required: true
      count:
        description: 新しい順に何件のビルドを読むか
        default: "3"

permissions: {}

jobs:
  logs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: workers-builds-logs
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - uses: masseater/typescript-template/.github/actions/credentials@a76b6452b4c008062dc453dc5f116557b8056978
      - run: vp run builds-logs
        working-directory: tools/cloudflare-logs
        env:
          WORKER: ${{ inputs.worker }}
          COUNT: ${{ inputs.count }}
          BUCKET: masseater-dev-worker-logs

  ci-telemetry:
    needs: [logs]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@a76b6452b4c008062dc453dc5f116557b8056978
        with:
          github-token: ${{ github.token }}
