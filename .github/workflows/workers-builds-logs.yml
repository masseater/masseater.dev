name: workers-builds-logs

on:
  workflow_dispatch:
    inputs:
      worker:
        description: ビルドのログを読む Worker のスクリプト名
        required: true
      count:
        description: 新しい順に何件のビルドを読むか
        default: "3"

permissions: {}

jobs:
  logs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/workers-builds-logs.sh
          sparse-checkout-cone-mode: false
      - run: .github/scripts/workers-builds-logs.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER: ${{ inputs.worker }}
          COUNT: ${{ inputs.count }}
          BUCKET: masseater-dev-worker-logs

  ci-telemetry:
    needs: [logs]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@e878a4f572871ac449cae3b2d4ab82861bbad2f4
        with:
          github-token: ${{ github.token }}
