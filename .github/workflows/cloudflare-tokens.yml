name: cloudflare-tokens

on:
  workflow_dispatch:
    inputs:
      delete:
        description: 消すトークンの ID（カンマ区切り）。空なら一覧だけ出す
        required: false
        default: ""

permissions: {}

concurrency:
  group: cloudflare-tokens

jobs:
  tokens:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: vpx cloudflare-tokens.ts
        working-directory: infra/repositories
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DELETE_TOKEN_IDS: ${{ inputs.delete }}

  ci-telemetry:
    needs: [tokens]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@89e5bb585e4d7f10b9218ca48377f9bb5949397a
        with:
          github-token: ${{ github.token }}
