name: persist-migrate

on:
  workflow_dispatch:

permissions: {}

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .nimado-state/youtube.json
            .nimado-state/data/days/youtube
          key: nimado-youtube-${{ github.run_id }}
          restore-keys: |
            nimado-youtube-
          fail-on-cache-miss: true
      - run: vp run --filter ./tools/nimado-collect persist-migrate
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/nimado-collect/.persist
          key: persist-nimado-collect-${{ github.run_id }}

  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - id: packages
        run: vp run -r task-packages daily

  mosaic:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - if: matrix.package.directory == 'tools/mosaic'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.package.directory == 'tools/mosaic'
        uses: $/.github/actions/setup
        with:
          native: "false"
      - id: pool
        if: matrix.package.directory == 'tools/mosaic'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/mosaic/.cache/pool.tar
          key: mosaic-pool-${{ matrix.package.item }}-${{ github.run_id }}
          restore-keys: |
            mosaic-pool-${{ matrix.package.item }}-
      - if: steps.pool.outputs.cache-matched-key != ''
        run: vp run --filter ./tools/mosaic persist-migrate
      - if: steps.pool.outputs.cache-matched-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/mosaic/.persist
          key: persist-${{ matrix.package.key }}-${{ github.run_id }}
