name: zap

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  zap:
    strategy:
      fail-fast: false
      matrix:
        target: [https://masseater.dev, https://med-db.masseater.dev]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/zap/rules.tsv
          sparse-checkout-cone-mode: false
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ matrix.target }}
          rules_file_name: .github/zap/rules.tsv
          allow_issue_writing: false
          fail_action: true

  ci-telemetry:
    needs: [zap]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@21e1352dbfeb4ac2e2f46aa277f01be5cd89906e
        with:
          github-token: ${{ github.token }}
