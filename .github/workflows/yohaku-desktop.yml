name: yohaku-desktop

on:
  push:
    branches: [main]
    paths:
      - "apps/yohaku-desktop/**"
      - "apps/yohaku-server/**"
      - "libs/yohaku-protocol/**"
      - ".github/workflows/yohaku-desktop.yml"
    tags: ["yohaku-v*"]
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
  RESOURCES: apps/yohaku-desktop/src-tauri/resources

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            bundles: nsis
            node: node.exe
            artifacts: target/release/bundle/nsis
            extension: exe
          - os: macos-latest
            platform: macos-arm64
            bundles: dmg
            node: node
            artifacts: target/release/bundle/dmg
            extension: dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: yohaku-${{ matrix.platform }}
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Bundle the server
        run: vp pack
        working-directory: apps/yohaku-server
      - name: Copy the server and the Node runtime
        env:
          NODE_FILE: ${{ matrix.node }}
        run: |
          mkdir -p "$RESOURCES/runtime" "$RESOURCES/server"
          cp "$(node -p "process.execPath")" "$RESOURCES/runtime/$NODE_FILE"
          cp apps/yohaku-server/dist/*.mjs "$RESOURCES/server/"
          version="$(node -p "require('./apps/yohaku-server/node_modules/@anthropic-ai/claude-agent-sdk/package.json').version")"
          printf '{"name":"yohaku-server","private":true,"type":"module","dependencies":{"@anthropic-ai/claude-agent-sdk":"%s"}}\n' "$version" > "$RESOURCES/server/package.json"
          printf 'nodeLinker: hoisted\n' > "$RESOURCES/server/pnpm-workspace.yaml"
      - name: Install the Agent SDK for this platform
        run: vp install --prod --no-frozen-lockfile
        working-directory: apps/yohaku-desktop/src-tauri/resources/server
      - name: Start the bundled server with the bundled Node
        env:
          NODE_FILE: ${{ matrix.node }}
        run: |
          data="$RUNNER_TEMP/yohaku-data"
          "$RESOURCES/runtime/$NODE_FILE" "$RESOURCES/server/main.mjs" --data-dir "$data" > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          for _ in $(seq 1 60); do
            if [ -s "$data/endpoint.json" ]; then
              kill "$server"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/server.log"
          exit 1
      - name: Build the installer
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: vp exec tauri build --bundles "$BUNDLES" --config src-tauri/tauri.release.conf.json
        working-directory: apps/yohaku-desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yohaku-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}/*.${{ matrix.extension }}
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ARTIFACTS: ${{ matrix.artifacts }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          gh release upload "$TAG" "$ARTIFACTS"/*."$EXTENSION" --clobber --repo "$GITHUB_REPOSITORY"

  ci-telemetry:
    needs: [installer]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@b77702f6b236f8c55096abed4aa408458d15d3c3
        with:
          github-token: ${{ github.token }}
