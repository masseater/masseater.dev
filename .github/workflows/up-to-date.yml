name: up-to-date

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  up-to-date:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: skills-lock
        if: github.event_name == 'pull_request'
        uses: masseater/typescript-template/.github/actions/pr-changed@5c4be9248ecb6ab249aacab2b3e3c8b3670421c1
        with:
          file: skills-lock.json
          github-token: ${{ github.token }}
      - id: lockfile
        if: github.event_name == 'pull_request'
        uses: masseater/typescript-template/.github/actions/pr-changed@5c4be9248ecb6ab249aacab2b3e3c8b3670421c1
        with:
          file: pnpm-lock.yaml
          github-token: ${{ github.token }}
      - if: steps.skills-lock.outputs.changed == 'true' || steps.lockfile.outputs.changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.skills-lock.outputs.changed == 'true'
        uses: masseater/typescript-template/.github/actions/skills-lock@5c4be9248ecb6ab249aacab2b3e3c8b3670421c1
        with:
          branch: ${{ github.head_ref }}
      - if: steps.lockfile.outputs.changed == 'true'
        uses: $/.github/actions/setup
        with:
          native: "false"
          cache: "false"

  wake:
    needs: [up-to-date]
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run update-branches.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
