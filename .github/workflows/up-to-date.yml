name: up-to-date

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  up-to-date:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: changed
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            skills-lock:
              - skills-lock.json
            lockfile:
              - pnpm-lock.yaml
      - if: steps.changed.outputs.skills-lock == 'true' || steps.changed.outputs.lockfile == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.changed.outputs.skills-lock == 'true'
        uses: masseater/typescript-template/.github/actions/skills-lock@b8e607c76fcd0b7207e1f6abb138a4473d7084dc
        with:
          branch: ${{ github.head_ref }}
      - if: steps.changed.outputs.lockfile == 'true'
        uses: $/.github/actions/setup
        with:
          native: "false"
