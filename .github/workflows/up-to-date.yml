name: up-to-date

on:
  pull_request:
    types:
      [opened, synchronize, reopened, ready_for_review, auto_merge_enabled, auto_merge_disabled]
  workflow_dispatch:

permissions: {}

env:
  TAKUMI_GUARD_TOKEN: ${{ secrets.TAKUMI_GUARD_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  up-to-date:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: masseater/typescript-template/.github/actions/auto-merge-gate@5fbdf9423d0e5debb5d59bc6d59bfec624343aff
      - id: lockfile
        if: github.event_name == 'pull_request'
        uses: masseater/typescript-template/.github/actions/pr-changed@5fbdf9423d0e5debb5d59bc6d59bfec624343aff
        with:
          file: pnpm-lock.yaml
          github-token: ${{ github.token }}
      - if: steps.lockfile.outputs.changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.lockfile.outputs.changed == 'true'
        uses: $/.github/actions/setup
        with:
          native: "false"
          cache: "false"

  wake:
    needs: [up-to-date]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.auto_merge
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run update-branches.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
