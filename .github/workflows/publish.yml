name: publish

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: Workspace directory to publish, such as libs/y8 or apps/yakusu
        required: true
        type: string

permissions: {}

env:
  TAKUMI_GUARD_TOKEN: ${{ secrets.TAKUMI_GUARD_TOKEN }}
  CARGO_TERM_COLOR: always
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

concurrency:
  group: publish-${{ inputs.workspace }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - id: plan
        run: vp exec msch-publish plan "$WORKSPACE"
        env:
          WORKSPACE: ${{ inputs.workspace }}
          GH_TOKEN: ${{ github.token }}

  native:
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).native[0] != null
    name: native (${{ matrix.platform.target }})
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.plan).native }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: "false"
          native: "false"
      - run: vp run --filter "./$DIRECTORY" native
        env:
          DIRECTORY: ${{ fromJSON(needs.plan.outputs.plan).directory }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native@${{ matrix.platform.target }}
          path: ${{ fromJSON(needs.plan.outputs.plan).directory }}/native/*.node
          if-no-files-found: error

  build:
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).builds[0] != null
    name: build (${{ matrix.platform.os }})
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.plan).builds }}
    runs-on: ${{ matrix.platform.runner }}
    environment: ${{ fromJSON(needs.plan.outputs.plan).environment }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        uses: $/.github/actions/linux-packages
        with:
          extra: xvfb
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          fetch_from_github: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ fromJSON(needs.plan.outputs.plan).name }}-${{ matrix.platform.os }}
          workspaces: |
            .
            tools/cargo-tools
      - run: vp run --filter "./$DIRECTORY" "release:$OS"
        env:
          DIRECTORY: ${{ fromJSON(needs.plan.outputs.plan).directory }}
          OS: ${{ matrix.platform.os }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports@${{ matrix.platform.os }}
          path: ${{ fromJSON(needs.plan.outputs.plan).directory }}/release-reports
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release@${{ matrix.platform.os }}
          path: ${{ fromJSON(needs.plan.outputs.plan).directory }}/release-assets
          if-no-files-found: error
          compression-level: 0

  check:
    needs: [plan, build]
    if: fromJSON(needs.plan.outputs.plan).checks[0] != null
    name: check (${{ matrix.platform.os }})
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.plan).checks }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release@${{ matrix.platform.os }}
          path: ${{ fromJSON(needs.plan.outputs.plan).directory }}/release-assets
      - run: vp run --filter "./$DIRECTORY" "release:check:$OS"
        env:
          DIRECTORY: ${{ fromJSON(needs.plan.outputs.plan).directory }}
          OS: ${{ matrix.platform.os }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports@${{ matrix.platform.os }}@check
          path: ${{ fromJSON(needs.plan.outputs.plan).directory }}/release-reports
          if-no-files-found: ignore

  npm:
    needs: [plan, native, build, check]
    if: >-
      !cancelled() && fromJSON(needs.plan.outputs.plan).npm
      && contains(fromJSON('["success", "skipped"]'), needs.native.result)
      && contains(fromJSON('["success", "skipped"]'), needs.build.result)
      && contains(fromJSON('["success", "skipped"]'), needs.check.result)
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: "false"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - if: needs.native.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native@*
          path: ${{ fromJSON(needs.plan.outputs.plan).directory }}/native
          merge-multiple: true
      - run: vp exec msch-publish npm "$DIRECTORY"
        env:
          DIRECTORY: ${{ fromJSON(needs.plan.outputs.plan).directory }}

  release:
    needs: [plan, build, check, npm]
    if: >-
      !cancelled() && (fromJSON(needs.plan.outputs.plan).npm || fromJSON(needs.plan.outputs.plan).release
        || !fromJSON(needs.plan.outputs.plan).tagged)
      && contains(fromJSON('["success", "skipped"]'), needs.build.result)
      && contains(fromJSON('["success", "skipped"]'), needs.check.result)
      && contains(fromJSON('["success", "skipped"]'), needs.npm.result)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - if: fromJSON(needs.plan.outputs.plan).release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release@*
          path: ${{ fromJSON(needs.plan.outputs.plan).directory }}/release-assets
          merge-multiple: true
      - id: release
        run: vp exec msch-publish release "$DIRECTORY"
        env:
          DIRECTORY: ${{ fromJSON(needs.plan.outputs.plan).directory }}
          GH_TOKEN: ${{ github.token }}
      - if: fromJSON(needs.plan.outputs.plan).hook
        run: vp run --filter "./$DIRECTORY" release:publish
        env:
          DIRECTORY: ${{ fromJSON(needs.plan.outputs.plan).directory }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}

  ci-telemetry:
    needs: [plan, native, build, check, npm, release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@5fbdf9423d0e5debb5d59bc6d59bfec624343aff
        with:
          github-token: ${{ github.token }}
