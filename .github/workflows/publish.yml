name: publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package directory under libs/
        required: true
        type: choice
        options: [sloppedia, injection-bisect, ocr-decide]
      ref:
        description: Tag or commit to publish
        required: true
        default: main

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: libs/${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: false
          run-install: |
            - args: ['--frozen-lockfile']
      - run: vp test run
      - if: inputs.package == 'sloppedia'
        run: vp run size
      - if: inputs.package != 'sloppedia'
        run: vp run build
      - run: vp pm pack --out "$RUNNER_TEMP/package.tgz"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish
        working-directory: ${{ runner.temp }}
        env:
          PACKAGE_JSON: ${{ github.workspace }}/libs/${{ inputs.package }}/package.json
        run: |
          name="$(jq -r .name "$PACKAGE_JSON")"
          version="$(jq -r .version "$PACKAGE_JSON")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published, skipping"
            exit 0
          fi
          npm publish "$RUNNER_TEMP/package.tgz" --provenance --access public

  ci-telemetry:
    needs: [publish]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@95e2f74d3c06b74eeb25e7188be85e0750964549
        with:
          github-token: ${{ github.token }}
