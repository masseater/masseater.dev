name: publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package directory under libs/
        required: true
        type: string
      ref:
        description: Tag or commit to publish
        required: true
        default: main

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  platforms:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
    defaults:
      run:
        working-directory: libs/${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: "false"
          native: "false"
      - id: platforms
        run: node ../../tools/npm-publish/bin/native-platforms.ts

  native:
    needs: platforms
    if: needs.platforms.outputs.platforms != '[]'
    name: native (${{ matrix.platform.target }})
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.platforms) }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: libs/${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: "false"
          native: "false"
      - run: vp run native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native@${{ matrix.platform.target }}
          path: libs/${{ inputs.package }}/native/*.node
          if-no-files-found: error

  publish:
    needs: [platforms, native]
    if: >-
      !cancelled() && needs.platforms.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.native.result)
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: libs/${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: "false"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - if: needs.native.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native@*
          path: libs/${{ inputs.package }}/native
          merge-multiple: true
      - run: node ../../tools/npm-publish/bin/npm-publish.ts

  ci-telemetry:
    needs: [platforms, native, publish]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@d79be66b83e21575c7f40a75453fea5a51aaff8c
        with:
          github-token: ${{ github.token }}
