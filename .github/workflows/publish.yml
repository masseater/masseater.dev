name: publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package directory under libs/
        required: true
        type: string
      ref:
        description: Tag or commit to publish
        required: true
        default: main

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: libs/${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: "false"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: node ../../tools/npm-publish/bin/npm-publish.ts

  ci-telemetry:
    needs: [publish]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@d31880940798de1570171b0bd255ec9e69005d83
        with:
          github-token: ${{ github.token }}
