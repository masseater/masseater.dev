name: exposure

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: exposure
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: exposure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: masseater/typescript-template/.github/actions/credentials@fbd4a5988a504e946a522545923ab00996487625
      - run: .github/scripts/github-token.sh
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - run: vp run --filter exposure-check check

  ci-telemetry:
    needs: [check]
    if: ${{ always() && github.workflow == 'exposure' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@fbd4a5988a504e946a522545923ab00996487625
        with:
          github-token: ${{ github.token }}
