name: exposure

on:
  repository_dispatch:
    types: [exposure]
  workflow_dispatch:
  workflow_call:

permissions: {}

env:
  TAKUMI_GUARD_TOKEN: ${{ secrets.TAKUMI_GUARD_TOKEN }}

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: exposure
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: exposure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: masseater/typescript-template/.github/actions/credentials@d79be66b83e21575c7f40a75453fea5a51aaff8c
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - run: vp run -r github-token
      - run: vp run -r exposure

  ci-telemetry:
    needs: [check]
    if: ${{ always() && github.workflow == 'exposure' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@d79be66b83e21575c7f40a75453fea5a51aaff8c
        with:
          github-token: ${{ github.token }}
