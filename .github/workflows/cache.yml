name: cache

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions: {}

env:
  TAKUMI_GUARD_TOKEN: ${{ secrets.TAKUMI_GUARD_TOKEN }}
  VP_REMOTE_CACHE: read-write

jobs:
  cache:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: cache-${{ github.ref }}
    env:
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pnpm/v12
          key: pnpm-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pnpm-metadata-
      - id: pnpm-metadata-before
        run: echo "files=$(find ~/.cache/pnpm/v12 -type f 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
      - uses: $/.github/actions/setup
        with:
          save-store: "true"
          session-path: "true"
          rust-cache: "false"
          sccache: "true"
          telemetry: "true"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/msch
          key: msch-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: msch-
      - uses: masseater/typescript-template/.github/actions/verify@9d0fe8a13d313a1110407250085e8ddb0d7e3e13
        with:
          github-token: ${{ github.token }}
          full-history: "true"
          share: "false"
      - if: always()
        uses: $/.github/actions/telemetry-files
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/msch
          key: msch-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - id: pnpm-metadata-after
        if: always()
        run: echo "files=$(find ~/.cache/pnpm/v12 -type f 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
      - if: always() && steps.pnpm-metadata-after.outputs.files != steps.pnpm-metadata-before.outputs.files
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pnpm/v12
          key: pnpm-metadata-${{ github.run_id }}-${{ github.run_attempt }}

  prune:
    needs: [cache]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - run: vp run -r prune-caches
        env:
          GH_TOKEN: ${{ github.token }}

  ci-telemetry:
    needs: [cache, prune]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@9d0fe8a13d313a1110407250085e8ddb0d7e3e13
        with:
          github-token: ${{ github.token }}
