name: yakusu

on:
  push:
    branches: [main]
    paths:
      - "apps/yakusu/**"
      - ".github/release-please/yakusu-*.json"
      - ".github/scripts/component-release.sh"
      - ".github/scripts/release-please-ready.sh"
      - ".github/workflows/yakusu.yml"
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            bundles: deb,appimage
            files: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            platform: windows-x64
            bundles: nsis
            files: target/release/bundle/nsis/*.exe
          - os: macos-latest
            platform: macos-arm64
            bundles: dmg
            files: target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && xargs -a .github/actions/setup/linux-packages.txt sudo apt-get install -y
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.platform }}
      - id: runtime
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/yakusu/src-tauri/resources/archives
            apps/yakusu/src-tauri/resources/models
          key: yakusu-runtime-${{ matrix.platform }}-${{ hashFiles('apps/yakusu/scripts/fetch-runtime.sh', 'apps/yakusu/src-tauri/src/model.rs') }}
      - name: Download llama-server and the licenses
        run: apps/yakusu/scripts/fetch-runtime.sh "$PLATFORM"
        env:
          PLATFORM: ${{ matrix.platform }}
      - name: Download the model as the app does and translate with it
        run: cargo test --package yakusu --test engine --locked -- --ignored
      - if: steps.runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/yakusu/src-tauri/resources/archives
            apps/yakusu/src-tauri/resources/models
          key: ${{ steps.runtime.outputs.cache-primary-key }}
      - name: Build the installer
        run: vp exec tauri build --config src-tauri/tauri.release.conf.json --bundles "$BUNDLES"
        working-directory: apps/yakusu
        env:
          BUNDLES: ${{ matrix.bundles }}
      - name: Collect the installers
        env:
          FILES: ${{ matrix.files }}
        run: |
          mkdir -p dist
          while read -r pattern; do
            [ -n "$pattern" ] || continue
            while read -r file; do cp "$file" dist/; done < <(compgen -G "$pattern")
          done <<<"$FILES"
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yakusu-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  release:
    needs: installer
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: yakusu-release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    concurrency:
      group: yakusu-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(.github/scripts/component-release.sh yakusu apps/yakusu yakusu)"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
      - if: steps.release.outputs.tag != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: yakusu-*
          path: dist
          merge-multiple: true
      - if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="${TAG#yakusu-v}"
          for file in dist/*; do
            if [[ "$(basename "$file")" != *_"$version"_* ]]; then
              echo "::error::$file was not built as $version; the installers were built from another revision"
              exit 1
            fi
          done
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
      - id: ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-please-ready.sh yakusu apps/yakusu
      - id: app-token
        if: steps.ready.outputs.ready == 'true'
        run: |
          oidc="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=masseater-dev-credential-broker" | jq -er .value)"
          echo "::add-mask::$oidc"
          token="$(curl -fsS --retry 3 -X POST -H "Authorization: Bearer $oidc" \
            "https://credentials.masseater.dev/" | jq -er '.githubToken // empty')"
          if [ -n "$token" ]; then
            echo "::add-mask::$token"
            echo "token=$token" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.app-token.outputs.token != ''
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please/yakusu-config.json
          manifest-file: .github/release-please/yakusu-manifest.json
          skip-github-release: true

  ci-telemetry:
    needs: [installer, release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@2c85ab1bc850356633eac92af1e7fdde163f7c28
        with:
          github-token: ${{ github.token }}
