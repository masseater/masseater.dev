name: yakusu

on:
  push:
    branches: [main]
    paths:
      - "apps/yakusu/**"
      - "libs/component-release/**"
      - "!**/*.md"
      - ".github/actions/linux-packages/**"
      - ".github/release-please/yakusu-*.json"
      - ".github/workflows/yakusu.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: yakusu
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - name: Tag the revision before main changes a workflow file
        env:
          GH_TOKEN: ${{ github.token }}
        run: vp run release:tag
        working-directory: apps/yakusu

  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            bundles: deb,appimage
            files: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            platform: windows-x64
            bundles: nsis
            files: target/release/bundle/nsis/*.exe
          - os: macos-latest
            platform: macos-arm64
            bundles: dmg
            files: target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        uses: $/.github/actions/linux-packages
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.platform }}
      - id: runtime
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/yakusu/src-tauri/resources/archives
            apps/yakusu/src-tauri/resources/models
          key: yakusu-runtime-${{ matrix.platform }}-${{ hashFiles('apps/yakusu/scripts/archive.ts', 'apps/yakusu/scripts/fetch-runtime.ts', 'apps/yakusu/src-tauri/src/model.rs') }}
      - name: Download llama-server and the licenses
        run: vp run ci:runtime "$PLATFORM"
        working-directory: apps/yakusu
        env:
          PLATFORM: ${{ matrix.platform }}
      - name: Download the model as the app does and translate with it
        run: vp run ci:engine
        working-directory: apps/yakusu
      - if: steps.runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/yakusu/src-tauri/resources/archives
            apps/yakusu/src-tauri/resources/models
          key: ${{ steps.runtime.outputs.cache-primary-key }}
      - name: Build the installer
        run: vp exec tauri build --config src-tauri/tauri.release.conf.json --bundles "$BUNDLES"
        working-directory: apps/yakusu
        env:
          BUNDLES: ${{ matrix.bundles }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yakusu-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 0

  launch:
    needs: installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: yakusu-${{ matrix.platform }}
          path: apps/yakusu/dist
      - name: Install the installer, launch the app and wait for its engine
        run: vp run ci:launch "$PLATFORM" dist
        working-directory: apps/yakusu
        env:
          PLATFORM: ${{ matrix.platform }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launch-yakusu-${{ matrix.platform }}
          path: apps/yakusu/launch/*
          if-no-files-found: ignore

  release:
    needs: [tag, installer, launch]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: yakusu-release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    concurrency:
      group: yakusu-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          native: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: yakusu-*
          path: apps/yakusu/installers
          merge-multiple: true
      - name: Publish the release with the installers unless it has them
        env:
          GH_TOKEN: ${{ github.token }}
        run: vp run release:publish
        working-directory: apps/yakusu
      - id: app-token
        env:
          GH_TOKEN: ${{ github.token }}
        run: vp run release:token
        working-directory: apps/yakusu
      - if: steps.app-token.outputs.token != ''
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please/yakusu-config.json
          manifest-file: .github/release-please/yakusu-manifest.json
          skip-github-release: true

  ci-telemetry:
    needs: [tag, installer, launch, release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@a76b6452b4c008062dc453dc5f116557b8056978
        with:
          github-token: ${{ github.token }}
