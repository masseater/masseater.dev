name: setup
description: Install the toolchain and the dependencies that verify needs in this repository
inputs:
  cache:
    description: Whether setup-vp restores its cache
    default: "true"
runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        cache: ${{ inputs.cache }}
        run-install: |
          - args: ['--frozen-lockfile']
    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        fetch_from_github: false
        cache: ${{ inputs.cache }}
    - shell: bash
      run: sudo apt-get update && xargs -a "$GITHUB_ACTION_PATH/linux-packages.txt" sudo apt-get install -y
    - shell: bash
      run: rustup toolchain install
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
