name: setup
description: Install the toolchain and the dependencies that verify needs in this repository
inputs:
  cache:
    description: Whether to restore the pnpm store and the mise tools from the Actions cache. The newest store entry restores whichever lockfile it was saved for, and install adds only the difference
    default: "true"
  save-store:
    description: Whether to save the pnpm store, pruned to what the lockfile needs, as the entry for this lockfile when the restore did not hit it exactly. Only the hourly cache job sets it, so a lockfile change on main adds no 2 GiB entry per push
    default: "false"
  session-path:
    description: Whether to move the checkout to /home/user/<repository>, where cloud sessions check out, and mount it back at the workspace before the install, so that the one install runs under the paths that cache keys hold and still hard links from the package store
    default: "false"
  native:
    description: Whether to install the tools of vite.config.ts and the apt packages that only verify needs, with the apt packages installing in the background while the other steps run
    default: "true"
  tools:
    description: Whether the install fetches the tools of vite.config.ts. Empty follows native, so a job that skips the apt packages can still ask for the tools
    default: ""
  rust-cache:
    description: Whether a job that installs the native tools also restores and saves the Rust build cache
    default: "true"
  sccache:
    description: Whether Rust compiles through sccache, which fetches each crate's compiled output from the GitHub Actions cache only when a Rust task really runs
    default: "false"
  telemetry:
    description: Whether a job that installs the native tools starts the OpenTelemetry Collector, which writes what it receives over OTLP on 127.0.0.1:4318 and the CPU, memory, disk space and network traffic of the runner to files that the telemetry-files action keeps
    default: "false"
runs:
  using: composite
  steps:
    - if: ${{ inputs.native == 'true' }}
      shell: bash
      run: |
        cp "$GITHUB_ACTION_PATH/linux-packages.txt" "$RUNNER_TEMP/linux-packages.txt"
        printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' 'DPkg::Lock::Timeout "120";' |
          sudo tee /etc/apt/apt.conf.d/99-setup-timeouts > /dev/null
        (
          for attempt in 1 2; do
            status=0
            # a timed-out attempt leaves dpkg running for a while, and dpkg itself does not wait for its lock
            {
              sudo timeout -k 10 120 bash -c 'while fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock > /dev/null 2>&1; do sleep 1; done' &&
                sudo dpkg --configure -a &&
                sudo timeout -k 10 60 apt-get update &&
                xargs -a "$RUNNER_TEMP/linux-packages.txt" sudo env DEBIAN_FRONTEND=noninteractive timeout -k 10 240 apt-get install -y
            } || status="$?"
            if [ "$status" -eq 0 ]; then
              break
            fi
            echo "::warning::apt attempt $attempt ended with status $status"
            # apt's mirror method fails over only when a mirror errors, not when it is slow,
            # so the retry demotes the mirror tried first via the mirrorlist's priority metadata.
            if [ "$attempt" -eq 1 ] && [ -f /etc/apt/apt-mirrors.txt ]; then
              first="$(awk -F '\t' '$1 !~ /^(#|$)/ && match($0, /priority:[0-9]+/) { p = substr($0, RSTART + 9, RLENGTH - 9) + 0; if (uri == "" || p < best) { best = p; uri = $1 } } END { print uri }' /etc/apt/apt-mirrors.txt)"
              if [ -n "$first" ]; then
                echo "::warning::moving $first to the end of the apt mirror order for the retry"
                awk -v uri="$first" 'BEGIN { FS = OFS = "\t" } $1 == uri { sub(/priority:[0-9]+/, "priority:999") } { print }' /etc/apt/apt-mirrors.txt |
                  sudo tee /etc/apt/apt-mirrors.txt.new > /dev/null &&
                  sudo mv /etc/apt/apt-mirrors.txt.new /etc/apt/apt-mirrors.txt
              fi
            fi
          done
          echo "$status" > "$RUNNER_TEMP/linux-packages.status"
        ) > "$RUNNER_TEMP/linux-packages.log" 2>&1 &
        echo "$!" > "$RUNNER_TEMP/linux-packages.pid"
    - if: ${{ env.TAKUMI_GUARD_TOKEN != '' }}
      shell: bash
      env:
        TOKEN: ${{ env.TAKUMI_GUARD_TOKEN }}
      run: printf '//npm.flatt.tech/:_authToken=%s\n' "$TOKEN" >> "$HOME/.npmrc"
    - id: lockfile-verified
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pnpm/lockfile-verified.jsonl
        key: lockfile-verified-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
    - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        cache: "false"
        run-install: false
    - id: store-path
      if: ${{ inputs.cache == 'true' || inputs.save-store == 'true' }}
      shell: bash
      run: echo "path=$(vp exec pnpm store path)" >> "$GITHUB_OUTPUT"
    - id: store
      if: ${{ inputs.cache == 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store-path.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
    - if: ${{ inputs.cache == 'true' && (inputs.tools || inputs.native) == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/vpa/tools
        key: vpa-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vpa-lock.json') }}
    - shell: bash
      env:
        SESSION_PATH: ${{ inputs.session-path }}
        VPA_TOOLS: ${{ inputs.tools || inputs.native }}
      run: |
        if [ "$SESSION_PATH" = true ]; then
          root="/home/user/${GITHUB_REPOSITORY#*/}"
          sudo mkdir -p "${root%/*}"
          sudo mv "$GITHUB_WORKSPACE" "$root"
          mkdir "$GITHUB_WORKSPACE"
          sudo mount --bind "$root" "$GITHUB_WORKSPACE"
          cd "$root"
        fi
        vp install --frozen-lockfile
        vp exec pnpm store prune
    - if: ${{ inputs.save-store == 'true' && steps.store.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store-path.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
    - if: ${{ steps.lockfile-verified.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pnpm/lockfile-verified.jsonl
        key: lockfile-verified-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
    - shell: bash
      run: echo "$GITHUB_WORKSPACE/.pnpm/rust/bin" >> "$GITHUB_PATH" # zizmor: ignore[github-env]
    - if: ${{ inputs.native == 'true' && inputs.telemetry == 'true' }}
      shell: bash
      env:
        OTEL_FILES: ${{ runner.temp }}/otel
      run: |
        mkdir -p "$OTEL_FILES"
        nohup "$GITHUB_WORKSPACE/node_modules/.bin/otelcol" --config "$GITHUB_ACTION_PATH/otelcol.yaml" > "$OTEL_FILES/collector.log" 2>&1 &
    - if: ${{ inputs.native == 'true' }}
      shell: bash
      run: |
        tail --pid="$(cat "$RUNNER_TEMP/linux-packages.pid")" -s 0.2 -n +1 -f "$RUNNER_TEMP/linux-packages.log"
        status="$(cat "$RUNNER_TEMP/linux-packages.status")"
        exit "$status"
    - if: ${{ inputs.sccache == 'true' }}
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.20.1
    - if: ${{ inputs.sccache == 'true' }}
      shell: bash
      env:
        SCCACHE_GHA_ENABLED: "true"
        SCCACHE_IDLE_TIMEOUT: "0"
      run: |
        if "$SCCACHE_PATH" --start-server; then
          mkdir -p "$HOME/.cargo"
          printf '[build]\nrustc-wrapper = "%s"\n' "$SCCACHE_PATH" >> "$HOME/.cargo/config.toml"
        else
          echo "::warning::sccache did not start, so Rust compiles without a cache"
        fi
    - if: ${{ inputs.native == 'true' && inputs.rust-cache == 'true' }}
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        cache-on-failure: "true"
        workspaces: |
          .
          tools/cargo-tools
