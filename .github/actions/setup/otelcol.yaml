receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
  hostmetrics:
    collection_interval: 5s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      load:
      memory:
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
          system.filesystem.inodes.usage:
            enabled: false
      network:
        metrics:
          system.network.packets:
            enabled: false
          system.network.errors:
            enabled: false
          system.network.dropped:
            enabled: false
          system.network.connections:
            enabled: false

exporters:
  file/traces:
    path: ${env:OTEL_FILES}/traces.jsonl
  file/metrics:
    path: ${env:OTEL_FILES}/metrics.jsonl
  file/logs:
    path: ${env:OTEL_FILES}/logs.jsonl

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [file/traces]
    metrics:
      receivers: [otlp, hostmetrics]
      exporters: [file/metrics]
    logs:
      receivers: [otlp]
      exporters: [file/logs]
