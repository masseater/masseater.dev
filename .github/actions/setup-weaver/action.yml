name: setup-weaver
description: Install OpenTelemetry Weaver from its GitHub release with the job token
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WEAVER_VERSION: 0.28.0
        WEAVER_SHA256: 9878e2d56ad82ae441b0b527377a4f6001ae19f4af362fb0a4d951884f59ab61
      run: |
        asset=weaver-x86_64-unknown-linux-gnu.tar.xz
        dir="$RUNNER_TEMP/weaver"
        gh release download "v$WEAVER_VERSION" --repo open-telemetry/weaver --pattern "$asset" --dir "$RUNNER_TEMP" --clobber
        echo "$WEAVER_SHA256  $RUNNER_TEMP/$asset" | sha256sum -c -
        mkdir -p "$dir"
        tar -xJf "$RUNNER_TEMP/$asset" -C "$dir" --strip-components=1
        mkdir -p "$HOME/.local/bin"
        install -m 755 "$dir/weaver" "$HOME/.local/bin/weaver"
        rm -rf "$RUNNER_TEMP/$asset" "$dir"
        weaver --version
