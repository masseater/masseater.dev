[package]
name = "mosaic"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
encoding_rs = "0.8.44"
fast_image_resize = "6.1.0"
fastrand = "2.5.0"
html-escape = "0.3.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jpeg-encoder = "0.7.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.5.1", features = ["platform-verifier"] }
webp = { version = "0.3.1", default-features = false }
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true
