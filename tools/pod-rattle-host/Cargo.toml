[package]
name = "pod-rattle-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
pod_rattle = { path = "../../apps/pod-rattle-plugin" }
pod-rattle-engine = { path = "../../libs/pod-rattle-engine" }
vst3-host = { version = "0.11.1", default-features = false }
hound = "3.5.1"
nice-plug = "0.4.2"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"
many_single_char_names = "allow"
needless_range_loop = "allow"

[dev-dependencies]
egui = "0.37.0"
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot"] }
triple_buffer = "9"
